# Project gate library. Referenced from workflow, pipeline and step gate lists
# with `use: <id>`.
#
# Only `builtin:` asserts and `custom:` JS/TS scripts resolve to an evaluator.
# A `type: shell` gate has no shell runner behind it and fails as an unknown
# gate, so the real build and test commands live in the workflow's
# deterministic steps and in contracts.yaml instead.
gates:
  - id: release-sign-off
    type: confirm
    prompt: "Release build and CTest suite are green on both presets. Tag and publish?"
    on_fail: block
    skip_in_ci: true
    label: "Release sign-off"
    options: [continue, abort]
    proceed_on: [continue]
