# Forge v2 configuration
# Generated by `forge setup` (template overlay deep-merged with base)

project_name: luminumbra
profile: polyglot-audit
workflow: polyglot-audit-workflow
routing:
  default_tier: standard
  deescalation_window: 3
  model_ceiling: deep
# Forge's calibrator engages enforcement after 10 samples by default. For a
# 34-task mixed-shape dispatch (docs + build infra + refactors + tests),
# 10 samples isn't enough for the MEDIAN calibrator to settle on a stable
# multiplier — the first run learned a 10.5x multiplier from 18 samples and
# rejected 16 of 16 subsequent tasks. Raising the project-local threshold to
# 30 covers the first ~2 waves of heterogeneous tasks before enforcement.
quality_gate:
  min_calibration_samples: 30
  # The MEDIAN calibrator over-fit a 7.19x multiplier from 26 engine-gate samples
  # (tasks legitimately read huge TUs: RenderPipeline.cpp, main_server.cpp,
  # RuntimeScenarioHarness.cpp), inflating raw ~1.2M-token estimates to ~9M and
  # rejecting 2/2 i7-ecology-visuals tasks at the 200K default ceiling. Local-dev
  # override: raise the estimated-token ceiling so legitimate large-file engine
  # tasks dispatch (results are gate-verified + reviewed regardless).
  max_estimated_tokens: 12000000
dispatch:
  spawner_priority: [codex, gemini, antigravity, local]
  spawner_override: codex
  allowed_spawners: [codex]
  sandbox: workspace-write
  sandbox_required: true
  max_parallel_default: 4
  agent_timeout_secs: 1800
  # The quality gate is read from dispatch.quality (runner.rs:
  # `quality_gate_config = dispatch_config.quality`). The top-level `quality_gate:`
  # block above is at the WRONG path and was silently ignored — which is why the
  # MEDIAN calibrator's 7.19x over-fit kept rejecting legitimate large-engine-file
  # tasks at the 200K default ceiling. Effective overrides (local dev):
  quality:
    max_estimated_tokens: 12000000   # large engine TUs legitimately estimate high
    min_calibration_samples: 500     # keep the over-fit multiplier advisory, not a hard skip
# The spawner's built-in default (gpt-5.3-codex) is no longer supported by
# ChatGPT-account Codex CLI; the codex-shim rewrites the model id instead
# (default_agent_config.model does not merge from the project layer).
# token_budget: engine-gate tasks legitimately read the large engine
# translation units (main_client.cpp, RenderPipeline.cpp, SHIELD_WorldSystem)
# whose conservative size estimates breach the 200k default ceiling.
decomposition:
  token_budget: 800000
  default_agent_config:
    model: gpt-5.5
budget:
  on_exceed: warn
tdd:
  enabled: true
  scope: both
  prefer_properties: true
  coverage_gate: 95
tags:
- '#team:engine'
- '#lang:cpp'
- '#domain:game-engine'
budgets:
  daily_per_developer: $30.00
workflows:
  default: polyglot-audit-workflow
  verify: verify-basic
  review: pr-review
