[extension]
name = "banso-sim"
version = "0.1.0"
description = "Observer-only deterministic simulation steps for Luminumbra"

[[steps]]
name = "smoke"
entrypoint = "steps/smoke.ts"
export = "runSmoke"

[[steps]]
name = "replay"
entrypoint = "steps/replay.ts"
export = "runReplay"

[[steps]]
name = "lockstep-loopback"
entrypoint = "steps/lockstep.ts"
export = "runLockstep"

[[gates]]
name = "simulation"
description = "Run the deterministic smoke simulation and require a successful process, retained output, and a world hash"
entrypoint = "gates/simulation-gate.ts"
export = "runSimulationGate"
from_phase = "implement"
to_phase = "verify"

[result]
schema = "banso.sim.result.v1"
description = "Each step returns exact process arguments, a verbatim world_hash or null, the raw exit state and its mechanical exit class, and paths to captured evidence."
required = ["schema", "step", "parameters", "world_hash", "exit", "evidence"]
exit_classes = ["exited-zero", "exited-nonzero", "signaled", "spawn-error"]
