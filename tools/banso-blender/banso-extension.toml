schema_version = 1
name = "banso-blender"
version = "1.0.0"
description = "Deterministic Blender asset-family regeneration"

[[steps]]
id = "regenerate-assets"
description = "Bake and validate every member declared by an asset-family sidecar"
command = "npm"
args = ["--prefix", "tools/banso-blender", "run", "regenerate-assets", "--"]
