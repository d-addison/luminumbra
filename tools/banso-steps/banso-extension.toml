[extension]
name = "luminumbra-steps"
version = "0.1.0"
description = "Shared process supervision and run manifest support for Luminumbra steps"

[[steps]]
name = "client.ui-screenshot"
description = "Capture one or more client UI screens"
entrypoint = "steps/ui-screenshot.ts"

[steps.parameters_schema]
type = "object"
additionalProperties = false
required = ["executable"]

[steps.parameters_schema.properties.executable]
type = "string"
minLength = 1

[steps.parameters_schema.properties.screen]
type = "string"
minLength = 1

[steps.parameters_schema.properties.directory]
type = "string"
minLength = 1

[steps.parameters_schema.properties.fixtures]
type = "boolean"

[steps.parameters_schema.properties.cwd]
type = "string"
minLength = 1

[steps.parameters_schema.properties.timeoutMs]
type = "integer"
minimum = 0

[steps.parameters_schema.properties.runId]
type = "string"
minLength = 1

[steps.parameters_schema.properties.manifestPath]
type = "string"
minLength = 1

[steps.parameters_schema.properties.environment]
type = "object"
additionalProperties = { type = "string" }

[steps.outputs_schema]
type = "object"
additionalProperties = false
required = ["runId", "exitClass", "exitCode", "manifestPath", "artifacts"]

[steps.outputs_schema.properties.runId]
type = "string"

[steps.outputs_schema.properties.exitClass]
enum = ["success", "failed", "timed_out", "cancelled", "signalled", "spawn_error"]

[steps.outputs_schema.properties.exitCode]
type = ["integer", "null"]

[steps.outputs_schema.properties.manifestPath]
type = "string"

[steps.outputs_schema.properties.artifacts]
type = "array"
items = { type = "object", required = ["name", "path"], properties = { name = { type = "string" }, path = { type = "string" }, kind = { type = "string" } }, additionalProperties = true }

