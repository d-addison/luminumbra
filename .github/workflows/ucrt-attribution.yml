name: UCRT64 package attribution

on:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * 0"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [devel]
    paths:
      - .github/workflows/ucrt-attribution.yml
      - tools/ci/ucrt_attribution.sh
      - tools/ci/ci_shell.py
      - tools/ci/test_ucrt_attribution.py
      - tools/ci/test_ucrt_gcc_cohort.py
      - tools/ci/check_worldgen_probe_smoke.py
      - tools/ci/test_check_worldgen_probe_smoke.py
      - test/diagnostics/worldgen_probe.cpp
  push:
    branches: [devel]
    paths:
      - .github/workflows/ucrt-attribution.yml
      - tools/ci/ucrt_attribution.sh
      - tools/ci/ci_shell.py
      - tools/ci/test_ucrt_attribution.py
      - tools/ci/test_ucrt_gcc_cohort.py
      - tools/ci/check_worldgen_probe_smoke.py
      - tools/ci/test_check_worldgen_probe_smoke.py
      - tools/CMakeLists.txt
      - test/CMakeLists.txt
      - test/diagnostics/worldgen_probe.cpp

permissions:
  contents: read

concurrency:
  # Devel pushes share one workflow/ref group: the running run finishes, while
  # GitHub's queue of one replaces a pending run with the newest devel push.
  # The push suffix separates this group from cancellable scheduled runs.
  # The campaign freeze audit covers a devel push run that ended cancelled
  # only with a newer devel push run of the same workflow path on a descendant
  # SHA that is pending or successful, or whose first attempt failed but has
  # an accepted automatic rerun request. Coverage is recomputed on every audit.
  # If the covering run later fails, or itself ends cancelled without its own
  # covering run, the freeze re-latches. Failed runs are never covered by
  # descendants; only their own successful rerun or an explicit resolution
  # can resolve them.
  # Main pushes and manual runs (including qualification captures) have isolated
  # groups and never cancel. PR ref grouping/cancellation stays unchanged.
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-manual-{1}', github.workflow, github.run_id) || github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}-{1}-{2}-{3}', github.workflow, github.ref, github.sha, github.run_id) || github.event_name == 'push' && github.ref == 'refs/heads/devel' && format('{0}-{1}-push', github.workflow, github.ref) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' && github.event_name != 'workflow_dispatch' }}

jobs:
  # Reuse the trusted, conservative native-input classifier for PR routing.
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs_cpp: ${{ steps.paths.outputs.needs_cpp }}
      needs_python: ${{ steps.paths.outputs.needs_python }}
    steps:
      - name: Check out repository and PR history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify merge-base diff (all lanes for non-PR events)
        id: paths
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Use already-fetched base history; never execute the PR's classifier.
          # The explicit guard also handles bases predating the fail-open rules.
          all_lanes() {
            echo 'Classification uncertain or CI inputs changed; running all lanes'
            printf 'needs_cpp=true\nneeds_python=true\n' >> "$GITHUB_OUTPUT"
          }
          if [ "$CI_EVENT" != pull_request ] || [ -z "$CI_BASE_SHA" ] ||
             [ -z "$CI_HEAD_SHA" ] || [ "$CI_REPOSITORY" != "$CI_HEAD_REPOSITORY" ]; then
            all_lanes
          elif ! git diff --quiet "$CI_BASE_SHA" "$CI_HEAD_SHA" -- tools/ci/ .github/workflows/ scripts/; then
            all_lanes
          elif git show "$CI_BASE_SHA:tools/ci/ci_paths.py" > "$RUNNER_TEMP/trusted-ci-paths.py"; then
            if ! python3 -I -B "$RUNNER_TEMP/trusted-ci-paths.py" classify --root "$GITHUB_WORKSPACE"; then
              all_lanes
            fi
          else
            all_lanes
          fi

  attribution:
    name: Toolchain package cohorts (UCRT64)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (needs.changes.result != 'success' || needs.changes.outputs.needs_cpp != 'false'))) }}
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          # The action clears its package cache at the end; restores come from
          # the archives the script stages itself, so the cache stays off.
          # Provision libatomic before baseline capture: the pinned old cc-libs
          # requires it, and intervention swaps only already installed members.
          cache: false
          install: >-
            curl
            diffutils
            git
            procps-ng
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libatomic
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-python-pillow
      - name: Record revisions and runner image
        shell: pwsh
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $imageVersion = if ($env:ImageVersion) { $env:ImageVersion } else { 'unknown' }
          $headSha = if ($env:HEAD_SHA) { $env:HEAD_SHA } else { 'not a pull request' }
          "IMAGE_VERSION=$imageVersion" | Add-Content -Path $env:GITHUB_ENV
          @(
            '## Revisions',
            '',
            '| Field | Value |',
            '| --- | --- |',
            "| pull request head sha | $headSha |",
            "| checked out sha | $env:MERGE_SHA |",
            "| runner image version | $imageVersion |"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Check attribution and smoke contracts
        shell: msys2 {0}
        run: |
          set -euo pipefail
          python tools/ci/test_ucrt_attribution.py
          python tools/ci/test_ucrt_gcc_cohort.py
          python tools/ci/test_check_worldgen_probe_smoke.py
      - name: Run package cohort cells
        shell: msys2 {0}
        run: bash tools/ci/ucrt_attribution.sh
      - name: Upload attribution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ucrt-attribution-${{ github.run_id }}
          path: diag/
          if-no-files-found: warn
          retention-days: 14
