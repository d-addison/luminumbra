name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            pkg-config \
            xorg-dev

      - name: Cache vendor build artifacts
        uses: actions/cache@v4
        with:
          path: build/release/vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'vendor/**') }}
          restore-keys: |
            ${{ runner.os }}-vendor-

      # One canonical tree (spec 020 OQ-1): build through the CMakePresets.json `release`
      # preset -> build/release. Never `cmake -S . -B build` (the retired root tree); the
      # BuildTreeStrict preflight refuses a concurrent root build/ tree.
      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release --output-on-failure

  forge-verify:
    name: Forge verify
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Forge gates
        run: forge verify --validation-policy fail --testing-policy fail
