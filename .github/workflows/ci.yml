name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]
  workflow_dispatch:
    inputs:
      qualification_capture:
        description: 'Explicit same-head AC2/AC4 artifact capture'
        type: boolean
        default: false
      expected_sha:
        description: 'Full candidate SHA; required when qualification capture is enabled'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Manual capture attempts have separate run groups. Every devel push has its
  # own commit group, preserving complete verdicts for previously merged tips.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification_capture && format('{0}-qualification-{1}', github.workflow, github.run_id) || format('{0}-{1}{2}', github.workflow, github.ref, github.event_name == 'push' && github.ref == 'refs/heads/devel' && format('-{0}', github.sha) || '') }}
  cancel-in-progress: ${{ !((github.event_name == 'workflow_dispatch' && inputs.qualification_capture) || (github.event_name == 'push' && github.ref == 'refs/heads/devel')) }}

env:
  QUALIFICATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
  QUALIFICATION_WORKFLOW_REF: ${{ github.workflow_ref }}
  QUALIFICATION_EXPECTED_SHA: ${{ inputs.expected_sha }}
  CTEST_PARALLEL_LEVEL: "4"

jobs:
  linux:
    name: Linux / GCC
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify manual qualification identity and dependencies
        id: identity
        if: github.event_name == 'workflow_dispatch' && inputs.qualification_capture
        run: python tools/ci/qualification_capture.py preflight --lane linux-gcc --expected-sha "$QUALIFICATION_EXPECTED_SHA"
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake extra-cmake-modules libfreetype6-dev \
            libgl1-mesa-dev libglu1-mesa-dev libwayland-dev libxkbcommon-dev \
            ninja-build pkg-config python3-numpy python3-pil wayland-protocols \
            xauth xorg-dev xvfb
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: linux-x64-gcc-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake', 'src/**/*.cmake', 'test/CMakeLists.txt', 'tools/CMakeLists.txt', 'vendor/CMakeLists.txt') }}
          restore-keys: linux-x64-gcc-ccache-
      - name: Configure
        id: configure
        run: >-
          cmake --preset release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DLUMINUMBRA_ENABLE_PREFAB_RUNTIME=ON
      - name: Build
        id: build
        run: cmake --build --preset release --parallel 4
      - name: Test
        id: tests
        run: |
          env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a ctest --preset release --no-tests=error -LE manual \
              --parallel 4 --timeout 180 --output-junit ctest.junit.xml
          # Inventory floor: measured 2301 tests on devel b56cdba1, minus ~1% margin.
          # It exists to catch whole suites silently vanishing (a CMake guard flipping,
          # discovery failing), not to be an exact inventory. Raise it when tests are
          # added in bulk; lowering it needs a justification in the PR description.
          python3 tools/ci/check_ctest_junit.py build/release/ctest.junit.xml --minimum-tests 2280
      - name: Qualify installed prefab runtime
        timeout-minutes: 5
        run: |
          python3 tools/ci/test_qualify_prefab_runtime.py
          python3 tools/ci/qualify_prefab_runtime.py --build build/release \
            --ctest-report build/release/ctest.junit.xml \
            --output build/release/test-artifacts/prefab-runtime
      - name: Test over-the-wire networking
        run: |
          ctest --preset release --no-tests=error -R '^NetSoak$' \
            --parallel 1 --output-junit netsoak.junit.xml
      - name: Bind manual qualification evidence
        if: always() && (github.event_name == 'workflow_dispatch' && inputs.qualification_capture)
        env:
          QUALIFICATION_PRODUCERS: '{"identity":"${{ steps.identity.outcome }}","configure":"${{ steps.configure.outcome }}","build":"${{ steps.build.outcome }}","tests":"${{ steps.tests.outcome }}"}'
        run: python tools/ci/qualification_capture.py write --lane linux-gcc --expected-sha "$QUALIFICATION_EXPECTED_SHA" --binary build/release/bin/common_tests --junit build/release/ctest.junit.xml --output build/release/qualification-capture.json
      - name: Upload manual qualification evidence
        if: always() && (github.event_name == 'workflow_dispatch' && inputs.qualification_capture)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-linux-gcc-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release/ctest.junit.xml
            build/release/qualification-capture.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-gcc-test-evidence-${{ github.sha }}
          path: |
            build/release/ctest.junit.xml
            build/release/netsoak.junit.xml
            build/release/Testing/Temporary
            build/release/test-artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Upload installed prefab generations and receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-gcc-prefab-runtime-${{ github.sha }}
          path: build/release/test-artifacts/prefab-runtime
          # Retain the synthetic project's .luminumbra-author generations too.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Validate dormant and enabled Linux packaging
        if: github.ref_name == 'main' || github.base_ref == 'main'
        run: |
          cmake -S . -B build/package-off -G Ninja -DBUILD_TESTING=OFF -DENABLE_BINARY_RELEASES=OFF
          test ! -e build/package-off/CPackConfig.cmake
          cmake -S . -B build/package-linux -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DENABLE_BINARY_RELEASES=ON -DLUMINUMBRA_WARNINGS_AS_ERRORS=ON
          cmake --build build/package-linux --target package --parallel 4

  gns-compile-probe:
    name: GNS transport / compile probe
    runs-on: ubuntu-24.04
    # Building GameNetworkingSockets from source (FetchContent + protobuf
    # codegen) is several minutes on top of the project build, well past the
    # 15 minutes a syntax-only probe needed.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install configure and GNS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake extra-cmake-modules libabsl-dev \
            libfreetype6-dev libgl1-mesa-dev libglu1-mesa-dev libprotobuf-dev \
            libssl-dev libwayland-dev libxkbcommon-dev ninja-build pkg-config \
            protobuf-compiler wayland-protocols xorg-dev
      - name: Configure GNS compile command
        run: |
          cmake -S . -B build/gns-probe -G Ninja \
            -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DLUMINUMBRA_ENABLE_DILIGENT=OFF -DLUMINUMBRA_ENABLE_GNS=ON
      - name: Build the shared sockets transport against GNS
        run: |
          # Upgraded from a -fsyntax-only probe of one file to a real build.
          # SteamNetworkingTransport and GnsTransport now share NetSocketsTransport,
          # because GameNetworkingSockets is Valve's open-source implementation of
          # the same ISteamNetworkingSockets interface that the Steamworks SDK
          # exposes. The Steam SDK is owner-provided and cannot be fetched here, so
          # building the GNS side is the only way to get real compile coverage of
          # the socket logic the Steam transport also runs. A syntax check could
          # not catch a link-level or template-instantiation break; this can.
          cmake --build build/gns-probe --target luminumbra_common --parallel 4
          # Fail loudly if the shared body was not actually part of that build,
          # so this job cannot silently degrade back into proving nothing.
          find build/gns-probe -name 'NetSocketsTransport.cpp.o' -print -quit \
            | grep -q . || { echo "NetSocketsTransport.cpp was not compiled"; exit 1; }

  diligent-rhi:
    name: Diligent RHI / software GL
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          # mesa-vulkan-drivers supplies lavapipe, Mesa's software Vulkan driver.
          # A hosted runner has no GPU and ships no Vulkan ICD at all, so without
          # it vkCreateInstance fails outright and the Vulkan half of this lane
          # can only ever report a null device. Discovery finds the ICD on its
          # own; the file name carries an architecture suffix on some Mesa
          # releases and not others, so do not pin a path to it.
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake extra-cmake-modules libfreetype6-dev \
            libgl1-mesa-dev libglu1-mesa-dev libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers ninja-build pkg-config python3-numpy \
            python3-pil wayland-protocols xauth xorg-dev xvfb
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: diligent-rhi-linux-x64-gcc-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake', 'src/**/*.cmake', 'test/CMakeLists.txt', 'tools/CMakeLists.txt', 'vendor/CMakeLists.txt') }}
          restore-keys: diligent-rhi-linux-x64-gcc-ccache-
      - name: Configure with Diligent RHI
        run: |
          cmake --preset release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLUMINUMBRA_ENABLE_DILIGENT=ON
      - name: Build with Diligent RHI
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Pull requests build only the targets the two Diligent suites need
          # (plus copy_data, which the whole-tree build also ran). Pushes to
          # devel/main still build the whole tree so DiligentCore's other targets
          # (for example Diligent-Archiver-static) keep their compile and link
          # coverage after every merge.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            cmake --build --preset release --parallel 4 \
              --target rhi_device_bringup_test rhi_pilot_flip_test copy_data
          else
            cmake --build --preset release --parallel 4
          fi
      - name: Test Diligent RHI with software GL
        run: |
          # gtest_discover_tests registers ctest names as Suite.Test, NOT the CMake
          # target name, so a target-name regex matches nothing and --no-tests=error
          # then fails the lane while the backend is perfectly healthy.
          env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a ctest --preset release --no-tests=error \
              -R '^RhiDeviceBringupGpu\.' --parallel 1 --timeout 180 \
              --output-on-failure --output-junit ctest-bringup.junit.xml
          # check_ctest_junit.py rejects any skipped test: these suites GTEST_SKIP when no
          # GL context can be created, and a skip must not read as a green required check.
          # ctest's own non-zero exit still fails the step first (bash -e).
          python3 tools/ci/check_ctest_junit.py build/release/ctest-bringup.junit.xml --minimum-tests 3
          env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a ctest --preset release --no-tests=error \
              -R '^RhiPilotParityGpu\.' --parallel 1 --timeout 180 \
              --output-on-failure --output-junit ctest-pilot.junit.xml
          python3 tools/ci/check_ctest_junit.py build/release/ctest-pilot.junit.xml --minimum-tests 2
      - name: Upload Diligent test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diligent-rhi-test-evidence-${{ github.sha }}
          path: |
            build/release/ctest-bringup.junit.xml
            build/release/ctest-pilot.junit.xml
          if-no-files-found: warn
          retention-days: 14

  windows-msvc:
    name: Windows / MSVC
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify manual qualification identity and dependencies
        id: identity
        if: github.event_name == 'workflow_dispatch' && inputs.qualification_capture
        run: python tools/ci/qualification_capture.py preflight --lane windows-msvc --expected-sha "$env:QUALIFICATION_EXPECTED_SHA"
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check numpy Pillow
      - name: Stage software OpenGL (Mesa3D llvmpipe)
        shell: pwsh
        run: |
          # Hosted Windows workers expose no GPU-backed GL. Stage the Mesa3D
          # llvmpipe rasterizer (the same driver the Linux lanes use through
          # LIBGL_ALWAYS_SOFTWARE=1) so the GL 4.5 core rendering/UI suites
          # run here instead of skipping. Pinned by version + sha256.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = '26.1.7'
          $sha256 = 'c6e90c3117233b66f7816df05026a5fb0f88eaf7829bd07a1724b981487ec0bb'
          $archive = "mesa3d-$version-release-msvc.7z"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$version/$archive"
          $archivePath = Join-Path $env:RUNNER_TEMP $archive
          Invoke-WebRequest -Uri $url -OutFile $archivePath
          $actual = (Get-FileHash -Algorithm SHA256 -Path $archivePath).Hash.ToLowerInvariant()
          if ($actual -ne $sha256) {
            throw "Mesa3D archive sha256 mismatch: expected $sha256, got $actual"
          }
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'mesa3d'
          # opengl32.dll is the WGL loader; libgallium_wgl.dll carries the
          # llvmpipe driver itself. dxil.dll is only needed for the d3d12
          # backends, which this lane does not use.
          7z x $archivePath "-o$mesaRoot" 'x64\opengl32.dll' 'x64\libgallium_wgl.dll' | Out-Null
          foreach ($dll in 'opengl32.dll', 'libgallium_wgl.dll') {
            if (-not (Test-Path (Join-Path $mesaRoot 'x64' $dll))) {
              throw "Mesa3D archive is missing x64/$dll"
            }
          }
      - name: Configure, build, and test
        id: native
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $installPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          Import-Module "$installPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cmake --preset release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          cmake --build --preset release --parallel 4
          # Retain one CPU-only diagnostic binary with its compiler runtime so a
          # terrain-hash failure can distinguish compiler output from host effects.
          # This temporary CI artifact is not a software release or game package.
          $diagnostic = 'build/release/worldgen-diagnostic'
          New-Item -ItemType Directory -Force $diagnostic | Out-Null
          Copy-Item build/release/bin/worldgen_layer_snapshot_test.exe $diagnostic
          $crt = @(Get-ChildItem (Join-Path $env:VCToolsRedistDir 'x64') -Directory -Filter 'Microsoft.VC*.CRT')
          if ($crt.Count -ne 1) { throw 'Expected exactly one x64 MSVC CRT directory' }
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item (Join-Path $crt[0].FullName $dll) $diagnostic
          }
          $files = @{}
          Get-ChildItem $diagnostic -File | ForEach-Object {
            $files[$_.Name] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          @{
            revision = (git rev-parse HEAD)
            purpose = 'CPU-only worldgen test diagnosis; not a release'
            compiler = (Get-Item (Get-Command cl).Source).VersionInfo.FileVersion
            portable_test_filter = 'WorldGenLayerSnapshotTest.DefaultShapingIsDeterministicAndAllSamplersAgree'
            diagnostic_output_variable = 'LUMINUMBRA_WORLDGEN_DIAGNOSTIC_DIR'
            limitation = 'Other cases may require the compile-time source checkout; the portable filter uses five synthetic presets only.'
            file_sha256 = $files
          } | ConvertTo-Json -Depth 4 | Set-Content "$diagnostic/identity.json"
          # Deploy the staged Mesa3D llvmpipe runtime next to the test
          # executables so glfwCreateWindow gets a GL 4.5 core context.
          Copy-Item (Join-Path $env:RUNNER_TEMP 'mesa3d/x64/opengl32.dll'), `
            (Join-Path $env:RUNNER_TEMP 'mesa3d/x64/libgallium_wgl.dll') `
            -Destination build/release/bin
          $env:GALLIUM_DRIVER = 'llvmpipe'
          ctest --preset release --no-tests=error -LE manual `
            --parallel 4 --timeout 180 --output-junit ctest.junit.xml
          # With llvmpipe deployed this lane holds the same standard as the
          # Linux software-GL lane: no GL-related skip is acceptable, and any
          # remaining skip is a hard failure.
          # Inventory floor: measured 2284 tests on devel b56cdba1, minus ~1% margin (see the Linux lane for the policy).
          python tools/ci/check_ctest_junit.py build/release/ctest.junit.xml --minimum-tests 2260
      - name: Bind manual qualification evidence
        if: always() && (github.event_name == 'workflow_dispatch' && inputs.qualification_capture)
        env:
          QUALIFICATION_PRODUCERS: '{"identity":"${{ steps.identity.outcome }}","native":"${{ steps.native.outcome }}"}'
        run: python tools/ci/qualification_capture.py write --lane windows-msvc --expected-sha "$env:QUALIFICATION_EXPECTED_SHA" --binary build/release/bin/common_tests.exe --junit build/release/ctest.junit.xml --output build/release/qualification-capture.json
      - name: Upload manual qualification evidence
        if: always() && (github.event_name == 'workflow_dispatch' && inputs.qualification_capture)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-windows-msvc-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release/ctest.junit.xml
            build/release/qualification-capture.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msvc-test-evidence-${{ github.sha }}
          path: |
            build/release/ctest.junit.xml
            build/release/Testing/Temporary
            build/release/test-artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Upload native worldgen diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msvc-worldgen-diagnostic-${{ github.sha }}
          path: build/release/worldgen-diagnostic
          if-no-files-found: warn
          retention-days: 14
      - name: Validate dormant and enabled Windows packaging
        if: github.ref_name == 'main' || github.base_ref == 'main'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $installPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          Import-Module "$installPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cmake -S . -B build/package-off -G Ninja -DBUILD_TESTING=OFF -DENABLE_BINARY_RELEASES=OFF
          if (Test-Path build/package-off/CPackConfig.cmake) { throw 'binary packaging enabled while disabled' }
          cmake -S . -B build/package-windows -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF -DENABLE_BINARY_RELEASES=ON -DLUMINUMBRA_WARNINGS_AS_ERRORS=ON
          cmake --build build/package-windows --target package --parallel 4

  windows-ucrt64:
    name: Windows / MSYS2 UCRT64
    # Runs on every pull request (devel- and main-bound) and on pushes to main, so a
    # MinGW/UCRT break shows on the PR that causes it instead of at promotion. It is
    # not a required devel context, so it informs rather than blocks there; it stays
    # required on main. Pushes to devel do not run it (the PR already did).
    if: github.event_name == 'pull_request' || github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.qualification_capture)
    runs-on: windows-2025
    # Measured 40.6 min end to end on the first post-release promotion run
    # (previously two 135-minute cap kills, before the test streaming caps
    # and parallel common_tests landed). Running the GL suites under
    # llvmpipe added ~2 min to the MSVC lane; UCRT's slower worldgen and
    # the Mesa3D download add a few more here, so the cap keeps ~1.9x
    # headroom over the projected ~45 min.
    timeout-minutes: 85
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify manual qualification identity and dependencies
        id: identity
        if: github.event_name == 'workflow_dispatch' && inputs.qualification_capture
        run: python tools/ci/qualification_capture.py preflight --lane windows-ucrt64 --expected-sha "$env:QUALIFICATION_EXPECTED_SHA"
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-python-pillow
      - name: Stage software OpenGL (Mesa3D llvmpipe)
        shell: pwsh
        run: |
          # Hosted Windows workers expose no GPU-backed GL. Stage the Mesa3D
          # llvmpipe rasterizer so the GL 4.5 core rendering/UI suites run
          # here instead of skipping, exactly as on the MSVC lane. The
          # release-msvc package also serves MinGW-built consumers: the WGL
          # boundary is the flat stdcall C ABI (the system opengl32.dll that
          # MinGW apps normally load is itself MSVC-built), and mesa-dist-win
          # documents its MSVC and MinGW packages as drop-in interchangeable.
          # Pinning the same artifact as the MSVC lane keeps one version and
          # one sha256 across both Windows lanes.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = '26.1.7'
          $sha256 = 'c6e90c3117233b66f7816df05026a5fb0f88eaf7829bd07a1724b981487ec0bb'
          $archive = "mesa3d-$version-release-msvc.7z"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$version/$archive"
          $archivePath = Join-Path $env:RUNNER_TEMP $archive
          Invoke-WebRequest -Uri $url -OutFile $archivePath
          $actual = (Get-FileHash -Algorithm SHA256 -Path $archivePath).Hash.ToLowerInvariant()
          if ($actual -ne $sha256) {
            throw "Mesa3D archive sha256 mismatch: expected $sha256, got $actual"
          }
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'mesa3d'
          # opengl32.dll is the WGL loader; libgallium_wgl.dll carries the
          # llvmpipe driver itself. dxil.dll is only needed for the d3d12
          # backends, which this lane does not use.
          7z x $archivePath "-o$mesaRoot" 'x64\opengl32.dll' 'x64\libgallium_wgl.dll' | Out-Null
          foreach ($dll in 'opengl32.dll', 'libgallium_wgl.dll') {
            if (-not (Test-Path (Join-Path $mesaRoot 'x64' $dll))) {
              throw "Mesa3D archive is missing x64/$dll"
            }
          }
      - name: Configure
        id: configure
        shell: msys2 {0}
        run: cmake --preset release
      - name: Build
        id: build
        shell: msys2 {0}
        run: cmake --build --preset release --parallel 4
      - name: Test
        id: tests
        shell: msys2 {0}
        run: |
          # Deploy the staged Mesa3D llvmpipe runtime next to the test
          # executables so glfwCreateWindow gets a GL 4.5 core context.
          mesa_root="$(cygpath -u "$RUNNER_TEMP")/mesa3d/x64"
          cp "$mesa_root/opengl32.dll" "$mesa_root/libgallium_wgl.dll" build/release/bin/
          export GALLIUM_DRIVER=llvmpipe
          # UCRT64 is a portability lane, not a machine-speed gate. World
          # generation is materially slower here than on GCC/MSVC runners.
          # Leash sized from the promotion-run evidence: the slowest cases
          # (RuntimeWorldVisualValidation) spend 174-178 s in world
          # generation, and their GL render portions complete in under a
          # second on the MSVC llvmpipe lane, so the projected worst case
          # stays near 190 s -> 360 s keeps ~2x runner-variance headroom
          # while catching the multi-minute stalls the old 720 s leash was
          # raised to paper over.
          ctest --preset release --no-tests=error -LE manual \
            --parallel 4 --timeout 360 --output-junit ctest.junit.xml
          # With llvmpipe deployed this lane holds the same standard as the
          # other software-GL lanes: no GL-related skip is acceptable, and
          # any remaining skip is a hard failure.
          # Inventory floor: measured 2284 tests on devel b56cdba1, minus ~1% margin (see the Linux lane for the policy).
          python tools/ci/check_ctest_junit.py build/release/ctest.junit.xml --minimum-tests 2260
      - name: Bind manual qualification evidence
        if: always() && (github.event_name == 'workflow_dispatch' && inputs.qualification_capture)
        shell: msys2 {0}
        env:
          QUALIFICATION_PRODUCERS: '{"identity":"${{ steps.identity.outcome }}","configure":"${{ steps.configure.outcome }}","build":"${{ steps.build.outcome }}","tests":"${{ steps.tests.outcome }}"}'
        run: python tools/ci/qualification_capture.py write --lane windows-ucrt64 --expected-sha "$QUALIFICATION_EXPECTED_SHA" --binary build/release/bin/common_tests.exe --junit build/release/ctest.junit.xml --output build/release/qualification-capture.json
      - name: Upload manual qualification evidence
        if: always() && (github.event_name == 'workflow_dispatch' && inputs.qualification_capture)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-windows-ucrt64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release/ctest.junit.xml
            build/release/qualification-capture.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-ucrt64-test-evidence-${{ github.sha }}
          path: |
            build/release/ctest.junit.xml
            build/release/Testing/Temporary
            build/release/test-artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Record toolchain identity
        if: always()
        continue-on-error: true
        shell: msys2 {0}
        run: |
          # Diagnostic only. No command may fail this step, so none uses set -e.
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo "## UCRT64 toolchain identity"
            echo ""
            echo "- Runner image: \`${ImageVersion:-unknown}\`"
            echo "- uname: \`$(uname -a 2>/dev/null || echo unknown)\`"
            echo "- g++ path: \`$(which g++ 2>/dev/null || echo not-found)\`"
            echo "- g++ version: \`$(g++ --version 2>/dev/null | head -1)\`"
            echo "- cmake version: \`$(cmake --version 2>/dev/null | head -1)\`"
            echo ""
            echo "<details><summary>Full package manifest</summary>"
            echo ""
            echo '```text'
            pacman -Q 2>/dev/null || true
            echo '```'
            echo "</details>"
            echo ""
            echo "Key packages:"
            echo ""
            echo '```text'
            pacman -Q 2>/dev/null | grep -E '^mingw-w64-ucrt-x86_64-(gcc|binutils|crt|headers|winpthreads|libwinpthread|cmake|ninja|python) ' || true
            echo '```'
            echo ""
          } >> "$summary" || true
      - name: Report slowest tests
        if: always()
        continue-on-error: true
        shell: msys2 {0}
        run: python tools/ci/slowest_tests.py build/release/ctest.junit.xml --summary-file "$GITHUB_STEP_SUMMARY"

  lint:
    name: Format changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install formatting tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format
      - name: Check formatting
        run: scripts/lint.sh --format-only

  tidy:
    name: Static analysis / clang-tidy
    runs-on: ubuntu-24.04
    # The gate analyses 351 translation units across src/, test/ and tools/, and since it
    # gained a real HeaderFilterRegex it also analyses first-party headers on every
    # one of them. That is a large multiple of the src/-only, headers-excluded scope
    # this job was originally sized for, and it overran the previous 30-minute limit
    # on a hosted runner at --jobs 4. Sized like the other heavy lanes (Linux 60,
    # UCRT64 85, MSVC 90) rather than trimmed back to fit.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang clang-tidy cmake extra-cmake-modules \
            libfreetype6-dev libgl1-mesa-dev libglu1-mesa-dev libwayland-dev \
            libxkbcommon-dev ninja-build pkg-config python3-numpy python3-pil \
            wayland-protocols xorg-dev
      - name: Configure compile database
        run: |
          cmake -S . -B build/tidy -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DLUMINUMBRA_ENABLE_DILIGENT=OFF \
            -DLUMINUMBRA_WARNINGS_AS_ERRORS=OFF \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Generate vendored headers used by first-party sources
        run: cmake --build build/tidy --target glad --parallel 4
      # Per-translation-unit result cache (scripts/tidy_cache.py). A unit is skipped
      # only when its complete analysis input (source, every header the compiler
      # reads, compile flags, check config, clang-tidy and compiler versions) is
      # identical to an earlier run that passed; anything else runs clang-tidy.
      # Pull requests read and write it. Pushes to devel/main never read it, so
      # every merged tip gets a full analysis, and they write it to seed the PRs.
      - name: Restore clang-tidy result cache
        id: tidy-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'pull_request'
        with:
          path: .tidy-cache
          key: tidy-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: tidy-cache-${{ runner.os }}-
      - name: Run blocking clang-tidy gate
        env:
          TIDY_CACHE_MODE: ${{ github.event_name == 'pull_request' && 'readwrite' || 'writeonly' }}
        run: scripts/tidy.sh --build-dir build/tidy --jobs 4 --cache-dir .tidy-cache --cache-mode "$TIDY_CACHE_MODE"
      - name: Save clang-tidy result cache
        if: ${{ !cancelled() && steps.tidy-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tidy-cache
          key: tidy-cache-${{ runner.os }}-${{ github.sha }}

  public-tree:
    name: Public tree / inventory honesty
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate publishable tree
        run: |
          python3 tools/ci/test_validate_public_tree.py
          python3 tools/ci/test_check_docs.py
          python3 tools/ci/test_check_ctest_junit.py
          python3 tools/ci/test_tidy_cache.py
          python3 tools/ci/test_validate_visual_catalog.py
          python3 tools/ci/validate_visual_catalog.py
          python3 tools/ci/render_visual_catalog.py --check
          python3 tools/ci/validate_public_tree.py
          python3 tools/ci/validate_assets.py --check config/public-asset-inventory.json
          python3 tools/check_runtime_data_manifest.py
          python3 tools/config_codegen.py --check
          python3 tools/config_codegen.py --check-constants
