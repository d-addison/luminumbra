name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
    branches: [main, devel]
  workflow_dispatch:
    inputs:
      qualification_capture:
        description: 'Explicit same-head AC2/AC4 artifact capture'
        type: boolean
        default: false
      expected_sha:
        description: 'Full candidate SHA; required when qualification capture is enabled'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Devel pushes share one workflow/ref group: the running run finishes, while
  # GitHub's queue of one replaces a pending run with the newest devel push.
  # The push suffix separates this group from cancellable scheduled runs.
  # The campaign freeze audit covers a devel push run that ended cancelled
  # only with a newer devel push run of the same workflow path on a descendant
  # SHA that is pending or successful, or whose first attempt failed but has
  # an accepted automatic rerun request. Coverage is recomputed on every audit.
  # If the covering run later fails, or itself ends cancelled without its own
  # covering run, the freeze re-latches. Failed runs are never covered by
  # descendants; only their own successful rerun or an explicit resolution
  # can resolve them.
  # Main pushes and manual runs (including qualification captures) have isolated
  # groups and never cancel. PR runs share workflow/ref and cancel older runs,
  # except edited events without changes.base: these use a unique, non-cancelling
  # group so title/body edits cannot interrupt validation on the same PR ref.
  group: ${{ (github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base) && format('{0}-metadata-{1}', github.workflow, github.run_id) || github.event_name == 'workflow_dispatch' && format('{0}-manual-{1}', github.workflow, github.run_id) || github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}-{1}-{2}-{3}', github.workflow, github.ref, github.sha, github.run_id) || github.event_name == 'push' && github.ref == 'refs/heads/devel' && format('{0}-{1}-push', github.workflow, github.ref) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base) && github.event_name != 'push' && github.event_name != 'workflow_dispatch' }}

env:
  QUALIFICATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
  QUALIFICATION_WORKFLOW_REF: ${{ github.workflow_ref }}
  QUALIFICATION_EXPECTED_SHA: ${{ inputs.expected_sha }}
  CTEST_PARALLEL_LEVEL: "4"

jobs:
  # Only base edits enter normal CI routing. All jobs reject other edited events
  # before allocating runners. Their distinct metadata-edit check names prevent
  # skipped duplicates from satisfying or replacing required checks on this SHA.
  # A pre-job/needs skip alone would still publish the original required names.
  # Required Linux/GCC jobs run native or standalone Python
  # tests on ready PRs. Other heavy jobs skip via this gate, with no needs chain.
  # !cancelled() and != false keep missing/failed classification on the build path.
  changes:
    name: Classify changed paths${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && ' (metadata edit)' || '' }}
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs_cpp: ${{ steps.paths.outputs.needs_cpp }}
      needs_python: ${{ steps.paths.outputs.needs_python }}
      needs_heavy: ${{ steps.paths.outputs.needs_heavy }}
      heavy_reason: ${{ steps.paths.outputs.heavy_reason }}
    steps:
      - name: Check out repository and PR history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify merge-base diff (all lanes for non-PR events)
        id: paths
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CI_BASE_REF: ${{ github.base_ref }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Use already-fetched base history; never execute the PR's classifier.
          # The explicit guard also handles bases predating the fail-open rules.
          all_lanes() {
            echo 'Classification uncertain or CI inputs changed; running all lanes'
            printf 'needs_cpp=true\nneeds_python=true\nneeds_heavy=true\nheavy_reason=classification_uncertain\n' >> "$GITHUB_OUTPUT"
          }
          if [ "$CI_EVENT" != pull_request ] || [ "$CI_BASE_REF" != devel ] || [ -z "$CI_BASE_SHA" ] ||
             [ -z "$CI_HEAD_SHA" ] || [ -z "$CI_REPOSITORY" ] || [ -z "$CI_HEAD_REPOSITORY" ] ||
             [ "$CI_REPOSITORY" != "$CI_HEAD_REPOSITORY" ]; then
            all_lanes
          elif ! git diff --quiet "$CI_BASE_SHA" "$CI_HEAD_SHA" -- tools/ci/ .github/workflows/ scripts/; then
            all_lanes
          elif git show "$CI_BASE_SHA:tools/ci/ci_paths.py" > "$RUNNER_TEMP/trusted-ci-paths.py"; then
            rm -f "$RUNNER_TEMP/classified-paths.txt"
            if GITHUB_OUTPUT="$RUNNER_TEMP/classified-paths.txt" python3 -I -B "$RUNNER_TEMP/trusted-ci-paths.py" classify --root "$GITHUB_WORKSPACE" &&
               python3 -I -B -c '
          import pathlib, sys
          rows = pathlib.Path(sys.argv[1]).read_text().splitlines()
          assert len(rows) == 4
          values = dict(row.split("=", 1) for row in rows)
          assert set(values) == {"needs_cpp", "needs_python", "needs_heavy", "heavy_reason"}
          assert all(values[key] in ("true", "false") for key in ("needs_cpp", "needs_python", "needs_heavy"))
          if values["needs_heavy"] == "false":
              assert values["heavy_reason"] == "reviewed_presentation_or_docs"
          else:
              assert values["needs_cpp"] == "true"
              assert values["heavy_reason"] in ("non_pr_event", "main_or_unknown_base", "classification_uncertain", "heavy_sensitive_paths")
          ' "$RUNNER_TEMP/classified-paths.txt"; then
              cat "$RUNNER_TEMP/classified-paths.txt" >> "$GITHUB_OUTPUT"
            else
              all_lanes
            fi
          else
            all_lanes
          fi


  # Drafts cannot merge. ready_for_review reruns these jobs on the same head;
  # maintainers must wait for that run's required checks to pass before merging.
  linux:
    name: ${{ matrix.shard == 0 && 'Linux / GCC full qualification' || format('Linux / GCC shard {0}/2', matrix.shard) }}${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && ' (metadata edit)' || '' }}
    # The required-name aggregate and the producer guard both reject drafts.
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base) && (!cancelled()) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Qualification captures keep one full, binary-bound producer.
        shard: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification_capture && fromJSON('[0]') || fromJSON('[1,2]') }}
    env:
      CI_NEEDS_HEAVY: ${{ needs.changes.outputs.needs_heavy }}
      CI_HEAVY_REASON: ${{ needs.changes.outputs.heavy_reason }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 400M
    outputs:
      route: ${{ steps.route.outputs.route }}
    steps:
      - name: Reject draft pull requests
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$CI_EVENT_NAME" = "pull_request" ] && [ "$CI_PR_DRAFT" != "false" ]; then
            echo "::error::Draft pull requests cannot merge. Mark ready for review and wait for the full checks."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report validation route
        id: route
        shell: bash
        env:
          NEEDS_CPP: ${{ needs.changes.outputs.needs_cpp }}
        run: |
          if [ "$NEEDS_CPP" = false ]; then
            route=python-only
            message='route: python-only (native build skipped by Classify changed paths)'
          else
            route=native
            message='route: native (full build and CTest enabled)'
          fi
          echo "$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          echo "route=$route" >> "$GITHUB_OUTPUT"
      - name: Install standalone Python test dependencies
        if: ${{ needs.changes.outputs.needs_cpp == 'false' || needs.changes.outputs.needs_python != 'false' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-numpy python3-pil python3-jsonschema
      - name: Run registered local-check deadlines
        id: local-contracts
        shell: bash
        env:
          LOCAL_CHECK_JUNIT: ${{ github.workspace }}/build/local-check-contracts/ctest.junit.xml
        run: |
          cmake -S tools/ci/contracts -B build/local-check-contracts -G Ninja "-DPython3_EXECUTABLE=$(python3 -I -B -c 'import sys; print(sys.executable)')"
          ctest --test-dir build/local-check-contracts --show-only=json-v1 > build/local-check-contracts/ctest-discovery.json
          ctest --test-dir build/local-check-contracts --no-tests=error --parallel 4 --output-on-failure --output-junit "$LOCAL_CHECK_JUNIT"
          python3 -I -B tools/ci/check_ctest_junit.py "$LOCAL_CHECK_JUNIT" --minimum-tests 4 --require-test ChangedTranslationUnitsContract --require-test OfflineDependenciesContract --require-test OfflineDependenciesContractPart1 --require-test OfflineDependenciesContractPart2
      - name: Upload local-check deadline evidence
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-local-check-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            build/local-check-contracts/ctest-discovery.json
            ${{ github.workspace }}/build/local-check-contracts/ctest.junit.xml
            build/local-check-contracts/Testing/Temporary
          if-no-files-found: warn
          retention-days: 14
      - name: Run standalone Python contracts (including CTest-registered suites)
        if: ${{ needs.changes.outputs.needs_cpp == 'false' || needs.changes.outputs.needs_python != 'false' }}
        run: python3 -B tools/ci/ci_paths.py python-tests
      - name: Verify manual qualification identity and dependencies
        id: identity
        if: ${{ needs.changes.outputs.needs_cpp != 'false' && (github.event_name == 'workflow_dispatch' && inputs.qualification_capture) }}
        run: python tools/ci/qualification_capture.py preflight --lane linux-gcc --expected-sha "$QUALIFICATION_EXPECTED_SHA"
      - name: Install build and test dependencies
        if: ${{ needs.changes.outputs.needs_cpp != 'false' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake extra-cmake-modules libfreetype6-dev \
            libgl1-mesa-dev libglu1-mesa-dev libwayland-dev libxkbcommon-dev \
            ninja-build pkg-config python3-numpy python3-pil wayland-protocols \
            xauth xorg-dev xvfb
      - name: Disable compiler cache for qualification captures
        if: ${{ needs.changes.outputs.needs_cpp != 'false' && (github.event_name == 'workflow_dispatch' && inputs.qualification_capture) }}
        run: echo "CCACHE_DISABLE=1" >> "$GITHUB_ENV"
      - name: Restore compiler cache
        id: compiler-cache
        if: ${{ needs.changes.outputs.needs_cpp != 'false' && (github.event_name != 'workflow_dispatch' || inputs.qualification_capture != true) }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: linux-x64-gcc-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake', 'src/**/*.cmake', 'test/CMakeLists.txt', 'tools/CMakeLists.txt', 'vendor/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            linux-x64-gcc-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake', 'src/**/*.cmake', 'test/CMakeLists.txt', 'tools/CMakeLists.txt', 'vendor/CMakeLists.txt') }}-
            linux-x64-gcc-ccache-
      - name: Prepare fresh RmlUi build root
        if: ${{ needs.changes.outputs.needs_cpp != 'false' }}
        run: python3 -I -B tools/ci/rmlui_source.py init --root build/release
      - name: Configure
        if: ${{ needs.changes.outputs.needs_cpp != 'false' }}
        id: configure
        run: >-
          cmake --preset release "-DPython3_EXECUTABLE=$(python3 -I -B -c 'import sys; print(sys.executable)')" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DLUMINUMBRA_ENABLE_PREFAB_RUNTIME=ON
      - name: Reset compiler cache statistics
        if: ${{ needs.changes.outputs.needs_cpp != 'false' && (always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || inputs.qualification_capture != true)) }}
        continue-on-error: true
        run: ccache -z || true
      - name: Build
        if: ${{ needs.changes.outputs.needs_cpp != 'false' }}
        id: build
        run: cmake --build --preset release --parallel 4
      - name: Report compiler cache statistics
        if: ${{ needs.changes.outputs.needs_cpp != 'false' && (always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || inputs.qualification_capture != true)) }}
        continue-on-error: true
        run: ccache -s || true
      - name: Clean compiler cache before saving
        if: ${{ matrix.shard == 1 && needs.changes.outputs.needs_cpp != 'false' && (always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') && (github.event_name != 'workflow_dispatch' || inputs.qualification_capture != true) && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true') }}
        continue-on-error: true
        run: ccache --cleanup || true
      - name: Save compiler cache
        if: ${{ matrix.shard == 1 && needs.changes.outputs.needs_cpp != 'false' && (always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') && (github.event_name != 'workflow_dispatch' || inputs.qualification_capture != true) && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true') }}
        # Cache writes are best-effort, including collisions on same-SHA reruns.
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: linux-x64-gcc-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake', 'src/**/*.cmake', 'test/CMakeLists.txt', 'tools/CMakeLists.txt', 'vendor/CMakeLists.txt') }}-${{ github.sha }}
      - name: Test
        if: ${{ needs.changes.outputs.needs_cpp != 'false' }}
        id: tests
        run: |
          ctest --preset release -LE manual --show-only=json-v1 > build/release/ctest.inventory.json
          ctest --preset release --show-only=json-v1 > build/release/ctest.all.json
          python3 tools/ci/ctest_shards.py plan --profile gcc --shard ${{ matrix.shard }} --directory build/release --require-suite SimBudgetWorldParity. --require-suite AmbientDeterminismReceipt. --require-suite PrefabRuntimeTest. --require-suite PrefabDigest. --needs-heavy "$CI_NEEDS_HEAVY"
          ctest --preset release --show-only=json-v1 > build/release/ctest-discovery.json
          env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a python3 tools/ci/ctest_shards.py run --profile gcc --directory build/release
          # Inventory floor: checked on the full suite here and the shard union below.
          # It exists to catch whole suites silently vanishing (a CMake guard flipping,
          # discovery failing), not to be an exact inventory. Raise it when tests are
          # added in bulk; lowering it needs a justification in the PR description.
          # Require each developer target explicitly; total-count margin cannot hide one.
          if [ '${{ matrix.shard }}' = 0 ]; then
            python3 tools/ci/check_ctest_junit.py build/release/ctest.junit.xml --minimum-tests 2340 --require-test ConsoleFixture.CompleteInventoryDefaultsBindingsAndUnavailableRows --require-test UiFixture.DefaultPassiveHudRendersWithoutShellOrFocusAndCanBeDisabled --require-test DeveloperPersistence.DirectConstructionMatchesFactoryDefaultsAndInitializesRecords
          fi
      - name: Qualify installed prefab runtime
        if: ${{ needs.changes.outputs.needs_cpp != 'false' && steps.tests.outputs.prefab == 'true' }}
        timeout-minutes: 5
        run: |
          python3 tools/ci/test_qualify_prefab_runtime.py
          python3 tools/ci/qualify_prefab_runtime.py --build build/release \
            --ctest-report build/release/ctest.junit.xml \
            --output build/release/test-artifacts/prefab-runtime
      - name: Test over-the-wire networking
        if: ${{ needs.changes.outputs.needs_cpp != 'false' && matrix.shard != 2 }}
        run: |
          ctest --preset release --no-tests=error -R '^NetSoak$' \
            --parallel 1 --output-junit netsoak.junit.xml
      - name: Bind manual qualification evidence
        if: ${{ needs.changes.outputs.needs_cpp != 'false' && (always() && (github.event_name == 'workflow_dispatch' && inputs.qualification_capture)) }}
        env:
          QUALIFICATION_PRODUCERS: '{"identity":"${{ steps.identity.outcome }}","configure":"${{ steps.configure.outcome }}","build":"${{ steps.build.outcome }}","tests":"${{ steps.tests.outcome }}"}'
        run: python tools/ci/qualification_capture.py write --lane linux-gcc --expected-sha "$QUALIFICATION_EXPECTED_SHA" --binary build/release/bin/common_tests --junit build/release/ctest.junit.xml --output build/release/qualification-capture.json
      - name: Upload manual qualification evidence
        if: ${{ needs.changes.outputs.needs_cpp != 'false' && (always() && (github.event_name == 'workflow_dispatch' && inputs.qualification_capture)) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-linux-gcc-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release/ctest.junit.xml
            build/release/qualification-capture.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload test evidence
        if: ${{ needs.changes.outputs.needs_cpp != 'false' && (always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-gcc-test-evidence-${{ github.sha }}-${{ github.run_id }}-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            build/release/ctest.junit.xml
            build/release/netsoak.junit.xml
            build/release/ctest-discovery.json
            build/release/Testing/Temporary
            build/release/test-artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Upload installed prefab generations and receipts
        if: ${{ needs.changes.outputs.needs_cpp != 'false' && (always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-gcc-prefab-runtime-${{ github.sha }}-${{ github.run_id }}-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: build/release/test-artifacts/prefab-runtime
          # Retain the synthetic project's .luminumbra-author generations too.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Validate dormant and enabled Linux packaging
        if: ${{ needs.changes.outputs.needs_cpp != 'false' && (github.ref_name == 'main' || github.base_ref == 'main') }}
        run: |
          python3 -I -B tools/ci/rmlui_source.py init --root build/package-off
          cmake -S . -B build/package-off "-DPython3_EXECUTABLE=$(python3 -I -B -c 'import sys; print(sys.executable)')" -G Ninja -DBUILD_TESTING=OFF -DENABLE_BINARY_RELEASES=OFF
          test ! -e build/package-off/CPackConfig.cmake
          python3 -I -B tools/ci/rmlui_source.py init --root build/package-linux
          cmake -S . -B build/package-linux "-DPython3_EXECUTABLE=$(python3 -I -B -c 'import sys; print(sys.executable)')" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DENABLE_BINARY_RELEASES=ON -DLUMINUMBRA_WARNINGS_AS_ERRORS=ON
          cmake --build build/package-linux --target package --parallel 4

      - name: Upload shard JUnit
        if: always() && needs.changes.outputs.needs_cpp != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gcc-junit-${{ github.sha }}-${{ github.run_id }}-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            build/release/ctest.junit.xml
            build/release/ctest.inventory.json
            build/release/ctest.partition.json
            build/release/ctest-discovery.json
            build/release/netsoak.junit.xml
          if-no-files-found: error
          retention-days: 30

  gns-compile-probe:
    name: GNS transport / compile probe${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && ' (metadata edit)' || '' }}
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base) && (!cancelled() && needs.changes.outputs.needs_cpp != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)) }}
    runs-on: ubuntu-24.04
    # Building GameNetworkingSockets from source (FetchContent + protobuf
    # codegen) is several minutes on top of the project build, well past the
    # 15 minutes a syntax-only probe needed.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install configure and GNS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake extra-cmake-modules libabsl-dev \
            libfreetype6-dev libgl1-mesa-dev libglu1-mesa-dev libprotobuf-dev \
            libssl-dev libwayland-dev libxkbcommon-dev ninja-build pkg-config \
            protobuf-compiler python3-numpy python3-pil wayland-protocols xorg-dev
      - name: Configure GNS and Tracy profile compile check
        run: |
          python3 -I -B tools/ci/rmlui_source.py init --root build/gns-probe
          cmake --preset profile -B build/gns-probe "-DPython3_EXECUTABLE=$(python3 -I -B -c 'import sys; print(sys.executable)')" \
            -DBUILD_TESTING=ON -DLUMINUMBRA_ENABLE_GNS=ON
      - name: Build production applications against GNS and pinned Tracy
        run: |
          # Upgraded from a -fsyntax-only probe of one file to a real build.
          # SteamNetworkingTransport and GnsTransport now share NetSocketsTransport,
          # because GameNetworkingSockets is Valve's open-source implementation of
          # the same ISteamNetworkingSockets interface that the Steamworks SDK
          # exposes. The Steam SDK is owner-provided and cannot be fetched here, so
          # building the GNS side is the only way to get real compile coverage of
          # the socket logic the Steam transport also runs. A syntax check could
          # not catch a link-level or template-instantiation break; this can.
          # Compile and link the actual common, server, shipping client and QA
          # capture paths with Tracy enabled. Do not run profiled determinism or
          # performance tests; their release/perf lanes remain uninstrumented.
          cmake --build build/gns-probe --parallel 4 --target \
            luminumbra_common luminumbra_server_app luminumbra_client_app luminumbra_client_qa_app \
            profiler_enabled_compile profiler_disabled_compile
          # Fail loudly if the shared body was not actually part of that build,
          # so this job cannot silently degrade back into proving nothing.
          find build/gns-probe -name 'NetSocketsTransport.cpp.o' -print -quit \
            | grep -q . || { echo "NetSocketsTransport.cpp was not compiled"; exit 1; }
          find build/gns-probe -path '*/modes/Gns.cpp.o' -print -quit \
            | grep -q . || { echo "Gns.cpp was not compiled"; exit 1; }
      - name: Check profiler build and source contracts
        run: ctest --test-dir build/gns-probe --no-tests=error -R '^ProfilerSourceContract$' --output-on-failure

  diligent-rhi:
    name: Diligent RHI / software GL${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && ' (metadata edit)' || '' }}
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base) && (!cancelled() && needs.changes.outputs.needs_cpp != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 250M
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          # mesa-vulkan-drivers supplies lavapipe, Mesa's software Vulkan driver.
          # A hosted runner has no GPU and ships no Vulkan ICD at all, so without
          # it vkCreateInstance fails outright and the Vulkan half of this lane
          # can only ever report a null device. Discovery finds the ICD on its
          # own; the file name carries an architecture suffix on some Mesa
          # releases and not others, so do not pin a path to it.
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake extra-cmake-modules libfreetype6-dev \
            libgl1-mesa-dev libglu1-mesa-dev libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers ninja-build pkg-config python3-numpy \
            python3-pil wayland-protocols xauth xorg-dev xvfb
      - name: Disable compiler cache for qualification captures
        if: github.event_name == 'workflow_dispatch' && inputs.qualification_capture
        run: echo "CCACHE_DISABLE=1" >> "$GITHUB_ENV"
      - name: Restore compiler cache
        id: compiler-cache
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.qualification_capture) }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: diligent-rhi-linux-x64-gcc-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake', 'src/**/*.cmake', 'test/CMakeLists.txt', 'tools/CMakeLists.txt', 'vendor/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            diligent-rhi-linux-x64-gcc-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake', 'src/**/*.cmake', 'test/CMakeLists.txt', 'tools/CMakeLists.txt', 'vendor/CMakeLists.txt') }}-
            diligent-rhi-linux-x64-gcc-ccache-
      - name: Configure with Diligent RHI
        run: |
          python3 -I -B tools/ci/rmlui_source.py init --root build/release
          cmake --preset release "-DPython3_EXECUTABLE=$(python3 -I -B -c 'import sys; print(sys.executable)')" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLUMINUMBRA_ENABLE_DILIGENT=ON
      - name: Reset compiler cache statistics
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.qualification_capture) }}
        continue-on-error: true
        run: ccache -z || true
      - name: Build with Diligent RHI
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Pull requests build only the targets the two Diligent suites need
          # (plus copy_data, which the whole-tree build also ran). Pushes to
          # devel/main still build the whole tree so DiligentCore's other targets
          # (for example Diligent-Archiver-static) keep their compile and link
          # coverage after every merge.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            cmake --build --preset release --parallel 4 \
              --target rhi_device_bringup_test rhi_pilot_flip_test copy_data
          else
            cmake --build --preset release --parallel 4
          fi
      - name: Report compiler cache statistics
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.qualification_capture) }}
        continue-on-error: true
        run: ccache -s || true
      - name: Clean compiler cache before saving
        if: ${{ always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') && !(github.event_name == 'workflow_dispatch' && inputs.qualification_capture) && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: ccache --cleanup || true
      - name: Save compiler cache
        if: ${{ always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') && !(github.event_name == 'workflow_dispatch' && inputs.qualification_capture) && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: diligent-rhi-linux-x64-gcc-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake', 'src/**/*.cmake', 'test/CMakeLists.txt', 'tools/CMakeLists.txt', 'vendor/CMakeLists.txt') }}-${{ github.sha }}
      - name: Test Diligent RHI with software GL
        run: |
          # gtest_discover_tests registers ctest names as Suite.Test, NOT the CMake
          # target name, so a target-name regex matches nothing and --no-tests=error
          # then fails the lane while the backend is perfectly healthy.
          env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a ctest --preset release --no-tests=error \
              -R '^RhiDeviceBringupGpu\.' --parallel 1 --timeout 180 \
              --output-on-failure --output-junit ctest-bringup.junit.xml
          # check_ctest_junit.py rejects any skipped test: these suites GTEST_SKIP when no
          # GL context can be created, and a skip must not read as a green required check.
          # ctest's own non-zero exit still fails the step first (bash -e).
          python3 tools/ci/check_ctest_junit.py build/release/ctest-bringup.junit.xml --minimum-tests 3
          env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a ctest --preset release --no-tests=error \
              -R '^RhiPilotParityGpu\.' --parallel 1 --timeout 180 \
              --output-on-failure --output-junit ctest-pilot.junit.xml
          python3 tools/ci/check_ctest_junit.py build/release/ctest-pilot.junit.xml --minimum-tests 2
      - name: Upload Diligent test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diligent-rhi-test-evidence-${{ github.sha }}
          path: |
            build/release/ctest-bringup.junit.xml
            build/release/ctest-pilot.junit.xml
          if-no-files-found: warn
          retention-days: 14

  linux-result:
    name: Linux / GCC${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && ' (metadata edit)' || '' }}
    needs: [changes, linux]
    # Keep invalid dependencies on the explicit failure path during cancellation.
    # Otherwise cancellation must stop the job even after its first guard.
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base) && (!cancelled() || needs.changes.result != 'success' || (needs.linux.result != 'success' && needs.linux.result != 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_NEEDS_HEAVY: ${{ needs.changes.outputs.needs_heavy }}
      CI_HEAVY_REASON: ${{ needs.changes.outputs.heavy_reason }}
    steps:
      - name: Reject draft pull requests
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$CI_EVENT_NAME" = "pull_request" ] && [ "$CI_PR_DRAFT" != "false" ]; then
            echo "::error::Draft pull requests cannot merge. Mark ready for review and wait for the full checks."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject invalid dependencies
        if: ${{ always() && (needs.changes.result != 'success' || (needs.linux.result != 'success' && needs.linux.result != 'skipped')) }}
        run: |
          echo "Aggregate dependencies did not pass" >&2
          exit 1
      - name: Require expected producers and route
        env:
          CI_PATHS_RESULT: ${{ needs.changes.result }}
          SHARD_RESULT: ${{ needs.linux.result }}
          NEEDS_CPP: ${{ needs.changes.outputs.needs_cpp }}
          CI_CANCELLED: "false"
          CI_EVENT: ${{ github.event_name }}
          CI_DRAFT: ${{ github.event.pull_request.draft }}
          CI_QUALIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification_capture }}
          CI_ENABLED: "true"
        run: >-
          python3 tools/ci/ctest_shards.py gate --result "$SHARD_RESULT" --cpp "$NEEDS_CPP"
          --cancelled "$CI_CANCELLED" --event "$CI_EVENT" --draft "$CI_DRAFT"
          --qualification "$CI_QUALIFICATION" --enabled "$CI_ENABLED" --classification "$CI_PATHS_RESULT"
      - name: Download shard JUnit
        if: needs.linux.result == 'success' && needs.changes.outputs.needs_cpp != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: gcc-junit-${{ github.sha }}-${{ github.run_id }}-shard-*-attempt-*
          path: build/gcc-shards
      - name: Merge shard JUnit and check inventory
        if: needs.linux.result == 'success' && needs.changes.outputs.needs_cpp != 'false'
        env:
          CI_QUALIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification_capture }}
        run: |
          full=()
          if [ "$CI_QUALIFICATION" = true ]; then full=(--full); fi
          python3 tools/ci/ctest_shards.py collect --directory build/gcc-shards \
            --prefix gcc-junit-${{ github.sha }}-${{ github.run_id }} --attempt ${{ github.run_attempt }} "${full[@]}"
          python3 tools/ci/ctest_shards.py merge --profile gcc --directory build/gcc-shards \
            --output build/release/ctest.junit.xml "${full[@]}" --needs-heavy "$CI_NEEDS_HEAVY" --reason "$CI_HEAVY_REASON"
          # The full discovery floor is enforced before the reviewed selection.
          minimum_tests=2340
          if [ "$CI_NEEDS_HEAVY" = false ]; then
            minimum_tests=$((minimum_tests - 2))
          fi
          # Require each developer target explicitly; total-count margin cannot hide one.
          python3 tools/ci/check_ctest_junit.py build/release/ctest.junit.xml --minimum-tests "$minimum_tests" --require-test ConsoleFixture.CompleteInventoryDefaultsBindingsAndUnavailableRows --require-test UiFixture.DefaultPassiveHudRendersWithoutShellOrFocusAndCanBeDisabled --require-test DeveloperPersistence.DirectConstructionMatchesFactoryDefaultsAndInitializesRecords
      - name: Check acceptance matrix CTest execution
        if: needs.linux.result == 'success' && needs.changes.outputs.needs_cpp != 'false'
        env:
          CI_QUALIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification_capture }}
        run: |
          # The networking owner is shard 1, or shard 0 for full qualification.
          owner=1
          if [ "$CI_QUALIFICATION" = true ]; then owner=0; fi
          cp "build/gcc-shards/shard-$owner/ctest-discovery.json" build/release/ctest-discovery.json
          cp "build/gcc-shards/shard-$owner/netsoak.junit.xml" build/release/netsoak.junit.xml
          python3 tools/ci/check_acceptance_matrix.py \
            --junit build/release/ctest.junit.xml --junit build/release/netsoak.junit.xml \
            --discovery build/release/ctest-discovery.json --ci-context \
            --execution-receipt build/release/test-artifacts/acceptance-execution.json \
            --preparation-receipt-file "$RUNNER_TEMP/acceptance-preparation-custody.json"
      - name: Upload merged JUnit
        if: always() && needs.linux.result == 'success' && needs.changes.outputs.needs_cpp != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gcc-merged-junit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release/ctest.junit.xml
            build/release/ctest.junit.selection.json
            build/release/ctest-discovery.json
            build/release/netsoak.junit.xml
            build/release/test-artifacts/acceptance-execution.json
          if-no-files-found: error
          retention-days: 30

  lint:
    name: Format changed files${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && ' (metadata edit)' || '' }}
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install formatting tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format
      - name: Check formatting
        run: scripts/lint.sh --format-only

  fast-compile:
    # Advisory during warning and duration calibration; never a required gate.
    name: Fast compile / GCC + clang-tidy${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && ' (metadata edit)' || '' }}
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CCACHE_DIR: ${{ github.workspace }}/scratch/fast-ccache
      CCACHE_MAXSIZE: 250M
      CCACHE_COMPILERCHECK: content
      CCACHE_REMOTE_STORAGE: ""
    steps:
      - name: Check out repository and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Route explicit non-native paths or conservative validation
        id: route
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -I -B tools/ci/changed_tus.py route --base-ref "${CI_BASE_SHA:-HEAD}" \
            --output "$GITHUB_OUTPUT" --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Validate shared selector contracts
        run: python3 -I -B tools/ci/test_changed_tus.py
      - name: Install fast validation dependencies
        if: steps.route.outputs.native != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache clang-18 clang-tidy-18 cmake extra-cmake-modules \
            libfreetype6-dev libgl1-mesa-dev libglu1-mesa-dev libwayland-dev \
            libxkbcommon-dev ninja-build pkg-config python3-numpy python3-pil \
            wayland-protocols xorg-dev
      - name: Configure GCC and Clang databases and generate headers
        if: steps.route.outputs.native != 'false'
        run: |
          python3 -I -B tools/ci/rmlui_source.py init --root build/fast-gcc
          cmake -S . -B build/fast-gcc -G Ninja "-DPython3_EXECUTABLE=$(python3 -I -B -c 'import sys; print(sys.executable)')" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=ON \
            -DLUMINUMBRA_ENABLE_DILIGENT=OFF -DLUMINUMBRA_ENABLE_PREFAB_RUNTIME=ON \
            -DLUMINUMBRA_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build/fast-gcc --target glad --parallel 2
          python3 -I -B tools/ci/rmlui_source.py init --root build/fast-clang
          cmake -S . -B build/fast-clang -G Ninja "-DPython3_EXECUTABLE=$(python3 -I -B -c 'import sys; print(sys.executable)')" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=ON \
            -DLUMINUMBRA_ENABLE_DILIGENT=OFF -DLUMINUMBRA_ENABLE_PREFAB_RUNTIME=ON \
            -DLUMINUMBRA_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build build/fast-clang --target glad --parallel 2
      - name: Replay selected compiles and both tidy configurations
        if: steps.route.outputs.native != 'false'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_FULL_SELECTION: ${{ steps.route.outputs.full }}
        run: |
          ccache --max-size 250M
          ccache --zero-stats
          full=()
          if [ "$CI_FULL_SELECTION" != false ]; then full=(--full-selection); fi
          python3 -I -B tools/ci/changed_tus.py ci --base-ref "${CI_BASE_SHA:-HEAD}" \
            --build-dir build/fast-gcc --clang-build-dir build/fast-clang \
            --jobs 2 --summary-file "$GITHUB_STEP_SUMMARY" \
            --evidence-file build/fast-checks-evidence.json "${full[@]}"
      - name: Upload fast selection and replay evidence
        if: always() && steps.route.outputs.native != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fast-checks-evidence
          path: build/fast-checks-evidence.json
          if-no-files-found: error
      - name: Report runner-local compiler cache statistics
        if: always() && steps.route.outputs.native != 'false'
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats >> "$GITHUB_STEP_SUMMARY"
          fi

  tidy-shard:
    name: Static analysis / clang-tidy shard ${{ matrix.shard }}/3${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && ' (metadata edit)' || '' }}
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base) && (!cancelled() && needs.changes.outputs.needs_cpp != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)) }}
    runs-on: ubuntu-24.04
    # The gate analyses 458 translation units across src/, test/ and tools/ plus
    # their first-party headers. Three standard hosted runners partition that
    # full scope by path hash so every merged tip gets complete analysis within
    # the unchanged 60-minute timeout; pushes still never skip cached units.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang clang-tidy cmake extra-cmake-modules \
            libfreetype6-dev libgl1-mesa-dev libglu1-mesa-dev libwayland-dev \
            libxkbcommon-dev ninja-build pkg-config python3-numpy python3-pil \
            wayland-protocols xorg-dev
      - name: Configure compile database
        run: |
          python3 -I -B tools/ci/rmlui_source.py init --root build/tidy
          cmake -S . -B build/tidy "-DPython3_EXECUTABLE=$(python3 -I -B -c 'import sys; print(sys.executable)')" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DLUMINUMBRA_ENABLE_DILIGENT=OFF \
            -DLUMINUMBRA_WARNINGS_AS_ERRORS=OFF \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Generate vendored headers used by first-party sources
        run: cmake --build build/tidy --target glad --parallel 4
      # Per-translation-unit result cache (scripts/tidy_cache.py). A unit is skipped
      # only when its complete analysis input (source, every header the compiler
      # reads, compile flags, check config, clang-tidy and compiler versions) is
      # identical to an earlier run that passed; anything else runs clang-tidy.
      # Pull requests only restore it. Pushes to devel/main never restore it, so
      # every merged tip gets a full analysis; only those pushes save it for PRs.
      - name: Restore clang-tidy result cache
        id: tidy-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'pull_request'
        with:
          path: .tidy-cache
          key: tidy-cache-${{ runner.os }}-shard${{ matrix.shard }}of3-${{ github.sha }}
          restore-keys: tidy-cache-${{ runner.os }}-shard${{ matrix.shard }}of3-
      - name: Run blocking clang-tidy gate
        env:
          TIDY_CACHE_MODE: ${{ github.event_name == 'pull_request' && 'readwrite' || 'writeonly' }}
        run: scripts/tidy.sh --build-dir build/tidy --jobs 4 --shard ${{ matrix.shard }}/3 --cache-dir .tidy-cache --cache-mode "$TIDY_CACHE_MODE"
      - name: Save clang-tidy result cache
        if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') && steps.tidy-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tidy-cache
          key: tidy-cache-${{ runner.os }}-shard${{ matrix.shard }}of3-${{ github.sha }}

  tidy:
    # Report the required result on uncancelled ready runs, including routed skips.
    name: Static analysis / clang-tidy${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && ' (metadata edit)' || '' }}
    needs: [changes, tidy-shard]
    # Keep invalid dependencies on the explicit failure path during cancellation.
    # Otherwise cancellation must stop the job even after its first guard.
    if: ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base) && ((!cancelled() || needs.changes.result != 'success' || (needs.tidy-shard.result != 'success' && needs.tidy-shard.result != 'skipped')) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject invalid dependencies
        if: ${{ always() && (needs.changes.result != 'success' || (needs.tidy-shard.result != 'success' && needs.tidy-shard.result != 'skipped')) }}
        run: |
          echo "Aggregate dependencies did not pass" >&2
          exit 1
      - name: Require all clang-tidy shards to pass
        if: always()
        env:
          TIDY_SHARD_RESULT: ${{ needs.tidy-shard.result }}
          CI_PATHS_RESULT: ${{ needs.changes.result }}
          NEEDS_CPP: ${{ needs.changes.outputs.needs_cpp }}
        run: |
          if [[ "$CI_PATHS_RESULT" == 'success' && "$NEEDS_CPP" == 'false' && "$TIDY_SHARD_RESULT" == 'skipped' ]]; then
            message="route: skipped (clang-tidy not needed by Classify changed paths)"
            echo "$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$TIDY_SHARD_RESULT" != 'success' ]]; then
            echo "clang-tidy shards did not all pass: $TIDY_SHARD_RESULT" >&2
            exit 1
          fi

  public-tree:
    name: Public tree / inventory honesty${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && ' (metadata edit)' || '' }}
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
