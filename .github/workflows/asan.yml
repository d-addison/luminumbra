name: AddressSanitizer

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]
  workflow_dispatch:
    inputs:
      qualification_capture:
        description: 'Explicit same-head AC2/AC4 artifact capture'
        type: boolean
        default: false
      expected_sha:
        description: 'Full candidate SHA; required when qualification capture is enabled'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Manual qualification attempts cannot cancel one another or ordinary runs.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification_capture && format('{0}-qualification-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.qualification_capture) }}

env:
  QUALIFICATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
  QUALIFICATION_WORKFLOW_REF: ${{ github.workflow_ref }}
  QUALIFICATION_EXPECTED_SHA: ${{ inputs.expected_sha }}

jobs:
  asan:
    name: Linux / GCC ASan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:symbolize=1
      CC: gcc
      CXX: g++
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify manual qualification identity and dependencies
        id: identity
        if: github.event_name == 'workflow_dispatch' && inputs.qualification_capture
        run: python tools/ci/qualification_capture.py preflight --lane asan --expected-sha "$QUALIFICATION_EXPECTED_SHA"
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake extra-cmake-modules libfreetype6-dev libgl1-mesa-dev \
            libglu1-mesa-dev libwayland-dev libxkbcommon-dev ninja-build pkg-config \
            python3-numpy python3-pil wayland-protocols xauth xorg-dev xvfb
      - name: Configure
        id: configure
        run: cmake --preset debug-asan
      - name: Build
        id: build
        run: cmake --build --preset debug-asan --parallel 4
      - name: Test
        id: tests
        run: |
          env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a ctest --preset debug-asan --no-tests=error -LE manual \
              --parallel 2 --timeout 300 --output-junit ctest.junit.xml
          # Inventory floor: measured 2281 tests on devel b56cdba1, minus ~1% margin (policy: see the Linux lane in ci.yml).
          python3 tools/ci/check_ctest_junit.py build/debug-asan/ctest.junit.xml --minimum-tests 2260
      - name: Bind manual qualification evidence
        if: always() && (github.event_name == 'workflow_dispatch' && inputs.qualification_capture)
        env:
          QUALIFICATION_PRODUCERS: '{"identity":"${{ steps.identity.outcome }}","configure":"${{ steps.configure.outcome }}","build":"${{ steps.build.outcome }}","tests":"${{ steps.tests.outcome }}"}'
        run: python tools/ci/qualification_capture.py write --lane asan --expected-sha "$QUALIFICATION_EXPECTED_SHA" --binary build/debug-asan/bin/common_tests --junit build/debug-asan/ctest.junit.xml --output build/debug-asan/qualification-capture.json
      - name: Upload manual qualification evidence
        if: always() && (github.event_name == 'workflow_dispatch' && inputs.qualification_capture)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-asan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/debug-asan/ctest.junit.xml
            build/debug-asan/qualification-capture.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload sanitizer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asan-test-evidence-${{ github.sha }}
          path: |
            build/debug-asan/ctest.junit.xml
            build/debug-asan/Testing/Temporary
            build/debug-asan/test-artifacts
          if-no-files-found: warn
          retention-days: 14
