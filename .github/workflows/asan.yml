name: AddressSanitizer

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan:
    name: ASan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:symbolize=1
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            ninja-build \
            pkg-config \
            xauth \
            xorg-dev \
            xvfb

      - name: Run sanitizer tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset debug-asan
          cmake --build --preset debug-asan --parallel
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
            ctest --preset debug-asan --output-on-failure --no-tests=error -LE manual
