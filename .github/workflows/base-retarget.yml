name: Base retarget

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, edited]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  base-retarget:
    name: Base retarget / fresh CI required
    runs-on: ubuntu-24.04
    steps:
      - name: Check out trusted base check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/ci/base_match.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check CI base
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B tools/ci/base_match.py
