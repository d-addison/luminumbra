name: Blender authoring contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, devel]
    paths:
      - 'tools/blender/**'
      - 'test/viewport/**'
      - '.github/workflows/blender-authoring.yml'
  push:
    branches: [main, devel]
    paths:
      - 'tools/blender/**'
      - 'test/viewport/**'
      - '.github/workflows/blender-authoring.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Devel pushes share one workflow/ref group: the running run finishes, while
  # GitHub's queue of one replaces a pending run with the newest devel push.
  # The push suffix separates this group from cancellable scheduled runs.
  # The campaign freeze audit covers a devel push run that ended cancelled
  # only with a newer devel push run of the same workflow path on a descendant
  # SHA that is pending or successful, or whose first attempt failed but has
  # an accepted automatic rerun request. Coverage is recomputed on every audit.
  # If the covering run later fails, or itself ends cancelled without its own
  # covering run, the freeze re-latches. Failed runs are never covered by
  # descendants; only their own successful rerun or an explicit resolution
  # can resolve them.
  # Main pushes and manual runs (including qualification captures) have isolated
  # groups and never cancel. PRs previously had no concurrency limit, so each
  # PR run keeps its own group and finishes without cancellation.
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-manual-{1}', github.workflow, github.run_id) || github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}-{1}-{2}-{3}', github.workflow, github.ref, github.sha, github.run_id) || github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.run_id) || github.event_name == 'push' && github.ref == 'refs/heads/devel' && format('{0}-{1}-push', github.workflow, github.ref) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Authoring mock / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Test CPU fixtures and mock contracts
        run: python -B tools/blender/authoring/probes/run.py --suite all --require-schemas
      - name: Test installed service and publication failures
        run: python -B -m unittest discover -s tools/blender/authoring/service/tests -v
      - name: Test adapter revision and debounce state
        run: python -B -m unittest discover -s tools/blender/authoring/extension_tests -v
      - name: Test authenticated viewport and owned process lifecycle
        run: python -B -m unittest discover -s test/viewport -v
      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authoring-mock-${{ matrix.os }}-${{ github.sha }}
          path: tools/blender/authoring/evidence/
          if-no-files-found: error
          retention-days: 14
