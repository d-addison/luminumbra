name: Blender authoring contracts

on:
  pull_request:
    branches: [main, devel]
    paths:
      - 'tools/blender/**'
      - '.github/workflows/blender-authoring.yml'
  push:
    branches: [main, devel]
    paths:
      - 'tools/blender/**'
      - '.github/workflows/blender-authoring.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Authoring mock / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Test CPU fixtures and mock contracts
        run: python -B tools/blender/authoring/probes/run.py --suite all --require-schemas
      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authoring-mock-${{ matrix.os }}-${{ github.sha }}
          path: tools/blender/authoring/evidence/
          if-no-files-found: error
          retention-days: 14
