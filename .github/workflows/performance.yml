name: Performance observations

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-frame:
    name: Preview frame / software OpenGL
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install measurement dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake extra-cmake-modules libfreetype6-dev \
            libgl1-mesa-dev libglu1-mesa-dev libwayland-dev libxkbcommon-dev \
            ninja-build pkg-config python3-numpy python3-pil wayland-protocols \
            xauth xorg-dev xvfb
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: perf-linux-x64-gcc-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake', 'src/**/*.cmake', 'test/CMakeLists.txt', 'vendor/CMakeLists.txt') }}
          restore-keys: perf-linux-x64-gcc-ccache-
      - name: Configure
        run: cmake --preset release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build measurement target
        run: cmake --build --preset release --target worldgen_preview_test --parallel 4
      - name: Measure preview frame
        continue-on-error: true
        run: |
          env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a ctest --preset release --no-tests=error \
              -R '^WorldgenPreviewTest\.PerFrameRenderHoldsPreviewBudget$' \
              --output-on-failure --output-junit performance.junit.xml
      - name: Validate measurement evidence
        if: always()
        run: |
          python3 tools/ci/validate_performance_measurement.py \
            build/release/performance.junit.xml \
            build/release/test-artifacts/performance/worldgen_preview_frame.json \
            build/release/performance-result.json \
            --test WorldgenPreviewTest.PerFrameRenderHoldsPreviewBudget
          cat build/release/performance-result.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload measurement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-frame-performance-${{ github.sha }}
          path: |
            build/release/performance.junit.xml
            build/release/performance-result.json
            build/release/Testing/Temporary
            build/release/test-artifacts
          if-no-files-found: warn
          retention-days: 30
