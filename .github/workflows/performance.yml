name: Performance observations

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main, devel]
  push:
    branches: [main, devel]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      qualification_capture:
        description: 'Explicit same-head AC2/AC4 artifact capture'
        type: boolean
        default: false
      expected_sha:
        description: 'Full candidate SHA; required when qualification capture is enabled'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Devel pushes share one workflow/ref group: the running run finishes, while
  # GitHub's queue of one replaces a pending run with the newest devel push.
  # The push suffix separates this group from cancellable scheduled runs.
  # The campaign freeze audit covers a devel push run that ended cancelled
  # only with a newer devel push run of the same workflow path on a descendant
  # SHA that is pending or successful, or whose first attempt failed but has
  # an accepted automatic rerun request. Coverage is recomputed on every audit.
  # If the covering run later fails, or itself ends cancelled without its own
  # covering run, the freeze re-latches. Failed runs are never covered by
  # descendants; only their own successful rerun or an explicit resolution
  # can resolve them.
  # Main pushes and manual runs (including qualification captures) have isolated
  # groups and never cancel. PR ref grouping/cancellation stays unchanged.
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-manual-{1}', github.workflow, github.run_id) || github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}-{1}-{2}-{3}', github.workflow, github.ref, github.sha, github.run_id) || github.event_name == 'push' && github.ref == 'refs/heads/devel' && format('{0}-{1}-push', github.workflow, github.ref) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' && github.event_name != 'workflow_dispatch' }}

env:
  QUALIFICATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
  QUALIFICATION_WORKFLOW_REF: ${{ github.workflow_ref }}
  QUALIFICATION_EXPECTED_SHA: ${{ inputs.expected_sha }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 250M

jobs:
  # Keep required job names and PR triggers unconditional. Heavy jobs need only
  # this gate; their job-level if reports skipped, with no skipped-needs chain.
  # !cancelled() and != false keep missing/failed classification on the build path.
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs_cpp: ${{ steps.paths.outputs.needs_cpp }}
      needs_python: ${{ steps.paths.outputs.needs_python }}
    steps:
      - name: Check out repository and PR history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify merge-base diff (all lanes for non-PR events)
        id: paths
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Use already-fetched base history; never execute the PR's classifier.
          # The explicit guard also handles bases predating the fail-open rules.
          all_lanes() {
            echo 'Classification uncertain or CI inputs changed; running all lanes'
            printf 'needs_cpp=true\nneeds_python=true\n' >> "$GITHUB_OUTPUT"
          }
          if [ "$CI_EVENT" != pull_request ] || [ -z "$CI_BASE_SHA" ] ||
             [ -z "$CI_HEAD_SHA" ] || [ "$CI_REPOSITORY" != "$CI_HEAD_REPOSITORY" ]; then
            all_lanes
          elif ! git diff --quiet "$CI_BASE_SHA" "$CI_HEAD_SHA" -- tools/ci/ .github/workflows/ scripts/; then
            all_lanes
          elif git show "$CI_BASE_SHA:tools/ci/ci_paths.py" > "$RUNNER_TEMP/trusted-ci-paths.py"; then
            if ! python3 -I -B "$RUNNER_TEMP/trusted-ci-paths.py" classify --root "$GITHUB_WORKSPACE"; then
              all_lanes
            fi
          else
            all_lanes
          fi

  runner-contract:
    name: Runner contract / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test performance result contract
        run: |
          python tools/perf/test_perf.py
          python tools/perf/test_fixture_hash.py
          python tools/perf/test_prepare_server_comparison.py
          python tools/perf/test_render_contract.py
          python tools/perf/test_capture_sim_budget.py
          python tools/perf/test_sim_budget_gate.py
          python tools/perf/test_check_residency.py
          python tools/perf/test_plan_qualification.py
          python tools/perf/test_run_qualification.py
          python tools/perf/test_render_budget.py
          python tools/ci/test_validate_performance_measurement.py
          python tools/ci/test_qualification_capture.py

  # Drafts cannot merge. ready_for_review reruns these jobs on the same
  # head; maintainers must wait for its required checks to pass before merging.
  preview-frame:
    name: Preview frame / software OpenGL
    # Drafts, including missing metadata, must reach the guard even on docs-only
    # changes. Ready PRs can still skip this lane through the path gate.
    needs: changes
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' && toJSON(github.event.pull_request.draft) != 'false') || needs.changes.outputs.needs_cpp != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Reject draft pull requests
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$CI_EVENT_NAME" = "pull_request" ] && [ "$CI_PR_DRAFT" != "false" ]; then
            echo "::error::Draft pull requests cannot merge. Mark ready for review and wait for the full checks."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install measurement dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake extra-cmake-modules libfreetype6-dev \
            libgl1-mesa-dev libglu1-mesa-dev libwayland-dev libxkbcommon-dev \
            ninja-build pkg-config python3-numpy python3-pil wayland-protocols \
            xauth xorg-dev xvfb
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: perf-linux-x64-gcc-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake', 'src/**/*.cmake', 'test/CMakeLists.txt', 'vendor/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            perf-linux-x64-gcc-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake', 'src/**/*.cmake', 'test/CMakeLists.txt', 'vendor/CMakeLists.txt') }}-
            perf-linux-x64-gcc-ccache-
      - name: Configure
        run: cmake --preset perf -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build measurement target
        run: cmake --build --preset perf --target worldgen_preview_test --parallel 4
      - name: Measure preview frame
        run: |
          env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a ctest --preset perf --no-tests=error \
              -R '^WorldgenPreviewTest\.(PerFrameRenderProducesComparableObservation|ResolvedShippingHillsRendersWithDefaultTemporalPresentation)$' \
              --output-on-failure --output-junit performance.junit.xml
      - name: Validate measurement evidence
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
        run: |
          python3 tools/ci/validate_performance_measurement.py \
            build/perf/performance.junit.xml \
            build/perf/test-artifacts/performance/worldgen_preview_frame.json \
            build/perf/performance-result.json \
            --test WorldgenPreviewTest.PerFrameRenderProducesComparableObservation --preset perf
          cat build/perf/performance-result.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload measurement evidence
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-frame-performance-${{ github.sha }}
          path: |
            build/perf/performance.junit.xml
            build/perf/performance-result.json
            build/perf/Testing/Temporary
            build/perf/test-artifacts
          if-no-files-found: warn
          retention-days: 30
      - name: Clean compiler cache before saving
        if: ${{ success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: ccache --cleanup
      - name: Save compiler cache
        if: ${{ success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        # Cache writes are best-effort, including collisions on same-SHA reruns.
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: perf-linux-x64-gcc-ccache-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**/*.cmake', 'src/**/*.cmake', 'test/CMakeLists.txt', 'vendor/CMakeLists.txt') }}-${{ github.sha }}

  server-smoke-comparison:
    name: Server smoke observation / base versus head
    # Runs on ready pull requests that target main (the promotion gate, where the
    # water verdict is required before release) and on pushes to main and devel
    # (so merged devel tips get complete verdicts after the fact). It is skipped on
    # pull requests that target devel: it is not a required devel check and costs
    # about 48 runner-minutes per push. The event.before guard stays because a
    # first push to a branch has no base to compare against; schedule and manual
    # events are excluded on purpose (they define no base/candidate SHA pair).
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.needs_cpp != 'false' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      ((github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') &&
      github.event.before != '0000000000000000000000000000000000000000'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
      - name: Check out base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: base
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake extra-cmake-modules libfreetype6-dev \
            libgl1-mesa-dev libglu1-mesa-dev libwayland-dev libxkbcommon-dev \
            ninja-build pkg-config python3-numpy python3-pil wayland-protocols xorg-dev
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: perf-paired-linux-x64-gcc-${{ github.event.pull_request.base.sha || github.event.before }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: perf-paired-linux-x64-gcc-
      - name: Prepare explicit common comparison workload
        run: |
          python3 head/tools/perf/prepare_server_comparison.py --base base --head head \
            --receipt build/server-comparison-fixture.json
      - name: Configure identical builds
        run: |
          cmake -S base -B build/base -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -g -DNDEBUG -fno-omit-frame-pointer" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLUMINUMBRA_ENABLE_ASAN=OFF \
            -DLUMINUMBRA_ENABLE_COVERAGE=OFF \
            -DLUMINUMBRA_ENABLE_DILIGENT=OFF \
            -DLUMINUMBRA_ENABLE_FRAME_POINTERS=ON \
            -DLUMINUMBRA_ENABLE_TRACY=OFF \
            -DLUMINUMBRA_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_PROJECT_INCLUDE="$GITHUB_WORKSPACE/head/cmake/performance_manifest.cmake"
          cmake -S head -B build/head -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -g -DNDEBUG -fno-omit-frame-pointer" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLUMINUMBRA_ENABLE_ASAN=OFF \
            -DLUMINUMBRA_ENABLE_COVERAGE=OFF \
            -DLUMINUMBRA_ENABLE_DILIGENT=OFF \
            -DLUMINUMBRA_ENABLE_FRAME_POINTERS=ON \
            -DLUMINUMBRA_ENABLE_TRACY=OFF \
            -DLUMINUMBRA_WARNINGS_AS_ERRORS=ON
      - name: Build identical targets
        run: |
          cmake --build build/base --target luminumbra_server_app --parallel 4
          cmake --build build/head --target luminumbra_server_app --parallel 4
      # Headless smoke consumes common simulation data. Client UI markup, fonts
      # and textures are not workload inputs and must not prevent comparison. The
      # server scope also omits client-only grass/rain/snow rendering parameters;
      # all simulation species/configuration files remain fingerprinted.
      - name: Measure base / first batch
        run: |
          BASE_FIXTURE=$(python3 head/tools/perf/prepare_server_comparison.py --hash base/perf-common)
          python3 head/tools/perf/perf.py run \
            --workload server-smoke --workload-version 1 --layer end-to-end \
            --preset perf --build-manifest build/base/performance-build.json \
            --commit "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --mode observation --warmup 1 --samples 10 --timeout 180 \
            --parameter ticks=30 --parameter surface_radius=1 \
            --parameter collision_radius=1 --parameter seed=1337 \
            --parameter world_preset=default --parameter simulation=controlled-legacy \
            --parameter autosave_ticks=0 --fixture-hash "$BASE_FIXTURE" \
            --evidence-contract server-smoke --evidence build/base/server-smoke-evidence-1.json \
            --output build/base/server-smoke-run-1.json -- \
            cmake -E chdir base ../build/base/bin/luminumbra_server_app \
              --smoke --root perf-common --preset default --autosave-ticks 0 \
              --seed 1337 --ticks 30 --radius 1 --collision-radius 1 \
              --artifact ../build/base/server-smoke-evidence-1.json
      - name: Measure candidate / first batch
        run: |
          HEAD_FIXTURE=$(python3 head/tools/perf/prepare_server_comparison.py --hash head/perf-common)
          python3 head/tools/perf/perf.py run \
            --workload server-smoke --workload-version 1 --layer end-to-end \
            --preset perf --build-manifest build/head/performance-build.json \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --mode observation --warmup 1 --samples 10 --timeout 180 \
            --parameter ticks=30 --parameter surface_radius=1 \
            --parameter collision_radius=1 --parameter seed=1337 \
            --parameter world_preset=default --parameter simulation=controlled-legacy \
            --parameter autosave_ticks=0 --fixture-hash "$HEAD_FIXTURE" \
            --evidence-contract server-smoke --evidence build/head/server-smoke-evidence-1.json \
            --output build/head/server-smoke-run-1.json -- \
            cmake -E chdir head ../build/head/bin/luminumbra_server_app \
              --smoke --root perf-common --preset default --autosave-ticks 0 \
              --seed 1337 --ticks 30 --radius 1 --collision-radius 1 \
              --artifact ../build/head/server-smoke-evidence-1.json
      - name: Measure candidate / second batch
        run: |
          HEAD_FIXTURE=$(python3 head/tools/perf/prepare_server_comparison.py --hash head/perf-common)
          python3 head/tools/perf/perf.py run \
            --workload server-smoke --workload-version 1 --layer end-to-end \
            --preset perf --build-manifest build/head/performance-build.json \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --mode observation --warmup 1 --samples 10 --timeout 180 \
            --parameter ticks=30 --parameter surface_radius=1 \
            --parameter collision_radius=1 --parameter seed=1337 \
            --parameter world_preset=default --parameter simulation=controlled-legacy \
            --parameter autosave_ticks=0 --fixture-hash "$HEAD_FIXTURE" \
            --evidence-contract server-smoke --evidence build/head/server-smoke-evidence-2.json \
            --output build/head/server-smoke-run-2.json -- \
            cmake -E chdir head ../build/head/bin/luminumbra_server_app \
              --smoke --root perf-common --preset default --autosave-ticks 0 \
              --seed 1337 --ticks 30 --radius 1 --collision-radius 1 \
              --artifact ../build/head/server-smoke-evidence-2.json
      - name: Measure base / second batch
        run: |
          BASE_FIXTURE=$(python3 head/tools/perf/prepare_server_comparison.py --hash base/perf-common)
          python3 head/tools/perf/perf.py run \
            --workload server-smoke --workload-version 1 --layer end-to-end \
            --preset perf --build-manifest build/base/performance-build.json \
            --commit "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --mode observation --warmup 1 --samples 10 --timeout 180 \
            --parameter ticks=30 --parameter surface_radius=1 \
            --parameter collision_radius=1 --parameter seed=1337 \
            --parameter world_preset=default --parameter simulation=controlled-legacy \
            --parameter autosave_ticks=0 --fixture-hash "$BASE_FIXTURE" \
            --evidence-contract server-smoke --evidence build/base/server-smoke-evidence-2.json \
            --output build/base/server-smoke-run-2.json -- \
            cmake -E chdir base ../build/base/bin/luminumbra_server_app \
              --smoke --root perf-common --preset default --autosave-ticks 0 \
              --seed 1337 --ticks 30 --radius 1 --collision-radius 1 \
              --artifact ../build/base/server-smoke-evidence-2.json
      - name: Combine interleaved batches
        run: |
          python3 head/tools/perf/perf.py combine \
            --runs build/base/server-smoke-run-1.json build/base/server-smoke-run-2.json \
            --output build/base/server-smoke-run.json
          python3 head/tools/perf/perf.py combine \
            --runs build/head/server-smoke-run-1.json build/head/server-smoke-run-2.json \
            --output build/head/server-smoke-run.json
      - name: Detect base perf artifact compatibility
        id: perf_schema
        run: |
          # The evidence-metric capability is folded into the artifact's
          # comparability key, so a base commit whose perf tooling predates it
          # produces a key the paired comparison refuses to evaluate. Degrade
          # that one transitional promotion to a recorded observation; once the
          # base branch carries the capability the full gate applies again.
          if git -C base grep -q -e "--evidence-metric" -- tools/perf/perf.py; then
            echo "compatible=true" >> "$GITHUB_OUTPUT"
          else
            echo "compatible=false" >> "$GITHUB_OUTPUT"
            echo "server-smoke: base perf artifact schema predates the evidence-metric capability; observation recorded, no paired verdict." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Compare base and candidate observation
        if: steps.perf_schema.outputs.compatible == 'true'
        run: |
          python3 head/tools/perf/perf.py compare \
            --base build/base/server-smoke-run.json \
            --candidate build/head/server-smoke-run.json \
            --limit 5 --min-samples 20 \
            --output build/server-smoke-comparison.json
      - name: Record transitional observation
        if: steps.perf_schema.outputs.compatible == 'false'
        run: |
          # Still write the (unevaluated) comparison document so the evidence
          # artifact shows exactly why no verdict was produced.
          python3 head/tools/perf/perf.py compare \
            --base build/base/server-smoke-run.json \
            --candidate build/head/server-smoke-run.json \
            --limit 5 --min-samples 20 \
            --output build/server-smoke-comparison.json || true
      - name: Detect base water-smoke support
        id: water_base
        run: |
          if git -C base grep -q -e "--water-smoke" -- src/luminumbra_server/main_server.cpp; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Water smoke gate degraded::Base commit predates --water-smoke; the head observation will be recorded, but no paired verdict can be produced."
          fi
      - name: Measure water base / first batch
        if: steps.water_base.outputs.supported == 'true'
        run: |
          BASE_FIXTURE=$(python3 head/tools/perf/prepare_server_comparison.py --hash base/perf-common)
          python3 head/tools/perf/perf.py run \
            --workload water-smoke --workload-version 1 --layer simulation \
            --preset perf --build-manifest build/base/performance-build.json \
            --commit "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --mode observation --warmup 1 --samples 10 --timeout 300 \
            --parameter ticks=300 --parameter surface_radius=2 \
            --parameter collision_radius=1 --parameter seed=1337 \
            --parameter world_preset=default --parameter simulation=controlled-legacy \
            --parameter autosave_ticks=0 --fixture-hash "$BASE_FIXTURE" \
            --evidence-contract server-smoke --evidence build/base/water-smoke-evidence-1.json \
            --evidence-metric water_phase_p95_ms \
            --output build/base/water-smoke-run-1.json -- \
            cmake -E chdir base ../build/base/bin/luminumbra_server_app \
              --water-smoke --root perf-common --preset default --autosave-ticks 0 \
              --seed 1337 --ticks 300 --radius 2 --collision-radius 1 \
              --artifact ../build/base/water-smoke-evidence-1.json
      - name: Measure water candidate / first batch
        run: |
          HEAD_FIXTURE=$(python3 head/tools/perf/prepare_server_comparison.py --hash head/perf-common)
          python3 head/tools/perf/perf.py run \
            --workload water-smoke --workload-version 1 --layer simulation \
            --preset perf --build-manifest build/head/performance-build.json \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --mode observation --warmup 1 --samples 10 --timeout 300 \
            --parameter ticks=300 --parameter surface_radius=2 \
            --parameter collision_radius=1 --parameter seed=1337 \
            --parameter world_preset=default --parameter simulation=controlled-legacy \
            --parameter autosave_ticks=0 --fixture-hash "$HEAD_FIXTURE" \
            --evidence-contract server-smoke --evidence build/head/water-smoke-evidence-1.json \
            --evidence-metric water_phase_p95_ms \
            --output build/head/water-smoke-run-1.json -- \
            cmake -E chdir head ../build/head/bin/luminumbra_server_app \
              --water-smoke --root perf-common --preset default --autosave-ticks 0 \
              --seed 1337 --ticks 300 --radius 2 --collision-radius 1 \
              --artifact ../build/head/water-smoke-evidence-1.json
      - name: Measure water candidate / second batch
        run: |
          HEAD_FIXTURE=$(python3 head/tools/perf/prepare_server_comparison.py --hash head/perf-common)
          python3 head/tools/perf/perf.py run \
            --workload water-smoke --workload-version 1 --layer simulation \
            --preset perf --build-manifest build/head/performance-build.json \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --mode observation --warmup 1 --samples 10 --timeout 300 \
            --parameter ticks=300 --parameter surface_radius=2 \
            --parameter collision_radius=1 --parameter seed=1337 \
            --parameter world_preset=default --parameter simulation=controlled-legacy \
            --parameter autosave_ticks=0 --fixture-hash "$HEAD_FIXTURE" \
            --evidence-contract server-smoke --evidence build/head/water-smoke-evidence-2.json \
            --evidence-metric water_phase_p95_ms \
            --output build/head/water-smoke-run-2.json -- \
            cmake -E chdir head ../build/head/bin/luminumbra_server_app \
              --water-smoke --root perf-common --preset default --autosave-ticks 0 \
              --seed 1337 --ticks 300 --radius 2 --collision-radius 1 \
              --artifact ../build/head/water-smoke-evidence-2.json
      - name: Measure water base / second batch
        if: steps.water_base.outputs.supported == 'true'
        run: |
          BASE_FIXTURE=$(python3 head/tools/perf/prepare_server_comparison.py --hash base/perf-common)
          python3 head/tools/perf/perf.py run \
            --workload water-smoke --workload-version 1 --layer simulation \
            --preset perf --build-manifest build/base/performance-build.json \
            --commit "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --mode observation --warmup 1 --samples 10 --timeout 300 \
            --parameter ticks=300 --parameter surface_radius=2 \
            --parameter collision_radius=1 --parameter seed=1337 \
            --parameter world_preset=default --parameter simulation=controlled-legacy \
            --parameter autosave_ticks=0 --fixture-hash "$BASE_FIXTURE" \
            --evidence-contract server-smoke --evidence build/base/water-smoke-evidence-2.json \
            --evidence-metric water_phase_p95_ms \
            --output build/base/water-smoke-run-2.json -- \
            cmake -E chdir base ../build/base/bin/luminumbra_server_app \
              --water-smoke --root perf-common --preset default --autosave-ticks 0 \
              --seed 1337 --ticks 300 --radius 2 --collision-radius 1 \
              --artifact ../build/base/water-smoke-evidence-2.json
      - name: Combine water interleaved batches
        run: |
          python3 head/tools/perf/perf.py combine \
            --runs build/head/water-smoke-run-1.json build/head/water-smoke-run-2.json \
            --output build/head/water-smoke-run.json
          if [ "${{ steps.water_base.outputs.supported }}" = "true" ]; then
            python3 head/tools/perf/perf.py combine \
              --runs build/base/water-smoke-run-1.json build/base/water-smoke-run-2.json \
              --output build/base/water-smoke-run.json
          fi
      - name: Compare water base and candidate observation
        if: steps.water_base.outputs.supported == 'true'
        run: |
          python3 head/tools/perf/perf.py compare \
            --base build/base/water-smoke-run.json \
            --candidate build/head/water-smoke-run.json \
            --limit 5 --min-samples 20 \
            --output build/water-smoke-comparison.json
      - name: Capture simulation budget evidence
        timeout-minutes: 20
        # Enforce complete pinned work limits for the head checkout's shipping defaults.
        run: |
          python3 head/tools/perf/capture_sim_budget.py \
            --binary build/head/bin/luminumbra_server_app \
            --evidence-dir build/head/sim-budget-capture \
            --ticks 600 --seed 1337 --radius 1 --collision-radius 1
          python3 head/tools/perf/propose_sim_budgets.py build/head/sim-budget-capture \
            --output build/head/sim-budget-proposal.json
          check_rc=0
          python3 head/tools/perf/check_sim_budgets.py build/head/sim-budget-capture \
            head/tools/perf/baselines/sim-budgets.json --require-complete \
            --output build/head/sim-budget-check.json \
            || check_rc=$?
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          verdicts = ("pass", "fail", "unpinned", "unbudgeted", "inactive", "missing")
          path = Path("build/head/sim-budget-check.json")
          if path.is_file():
              summary = json.loads(path.read_text(encoding="utf-8"))["summary"]
              counts = " ".join(f"{name}={summary[name]}" for name in verdicts)
              line = f"Sim budget check: {counts}"
          else:
              line = "Sim budget check: unevaluated"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(line + "\n")
          PY
          exit $check_rc
      - name: Publish comparison summary
        if: always()
        run: |
          test -f build/server-smoke-comparison.json
          cat build/server-smoke-comparison.json >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/water-smoke-comparison.json ]; then
            cat build/water-smoke-comparison.json >> "$GITHUB_STEP_SUMMARY"
          elif [ -f build/head/water-smoke-run.json ]; then
            {
              echo "## ⚠️ Water smoke gate: DEGRADED — NO PAIRED VERDICT"
              echo
              echo "**Status: degraded (not a pass).** The base commit predates \`--water-smoke\`; a head-only observation artifact was recorded, so no paired comparison verdict is available."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload paired evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-smoke-comparison-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/base/server-smoke-run.json
            build/base/server-smoke-run-*.json
            build/base/server-smoke-evidence-*.json
            build/head/server-smoke-run.json
            build/head/server-smoke-run-*.json
            build/head/server-smoke-evidence-*.json
            build/server-smoke-comparison.json
            build/server-comparison-fixture.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload simulation budget evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-budget-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/head/sim-budget-capture
            build/head/sim-budget-proposal.json
            build/head/sim-budget-check.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload water paired evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: water-smoke-comparison-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/base/water-smoke-run.json
            build/base/water-smoke-run-*.json
            build/base/water-smoke-evidence-*.json
            build/head/water-smoke-run.json
            build/head/water-smoke-run-*.json
            build/head/water-smoke-evidence-*.json
            build/water-smoke-comparison.json
          if-no-files-found: error
          retention-days: 30
      - name: Clean compiler cache before saving
        if: ${{ success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: ccache --cleanup
      - name: Save compiler cache
        if: ${{ success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: perf-paired-linux-x64-gcc-${{ github.event.pull_request.base.sha || github.event.before }}-${{ github.event.pull_request.head.sha || github.sha }}

  qualification-capture:
    name: Simulation budget qualification / candidate
    # Independent candidate-only path: a missing/incompatible comparison base
    # never prevents AC2 source evidence. Routine paired routing stays above.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.needs_cpp != 'false' && github.event_name == 'workflow_dispatch' && inputs.qualification_capture }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact dispatched candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify manual qualification identity and dependencies
        id: identity
        run: python3 tools/ci/qualification_capture.py preflight --lane server-capture --expected-sha "$QUALIFICATION_EXPECTED_SHA"
      - name: Install candidate build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake extra-cmake-modules libfreetype6-dev \
            libgl1-mesa-dev libglu1-mesa-dev libwayland-dev libxkbcommon-dev \
            ninja-build pkg-config python3-numpy python3-pil wayland-protocols xorg-dev
      - name: Disable compiler cache for qualification captures
        if: github.event_name == 'workflow_dispatch' && inputs.qualification_capture
        run: echo "CCACHE_DISABLE=1" >> "$GITHUB_ENV"
      - name: Restore candidate compiler cache
        id: compiler-cache
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.qualification_capture) }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: qualification-server-linux-x64-gcc-${{ github.sha }}
          restore-keys: qualification-server-linux-x64-gcc-
      - name: Configure candidate
        id: configure
        run: |
          cmake -S . -B build/qualification-build -G Ninja \
            -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -g -DNDEBUG -fno-omit-frame-pointer" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLUMINUMBRA_ENABLE_ASAN=OFF -DLUMINUMBRA_ENABLE_COVERAGE=OFF \
            -DLUMINUMBRA_ENABLE_DILIGENT=OFF -DLUMINUMBRA_ENABLE_FRAME_POINTERS=ON \
            -DLUMINUMBRA_ENABLE_TRACY=OFF -DLUMINUMBRA_WARNINGS_AS_ERRORS=ON
      - name: Build candidate server
        id: build
        run: cmake --build build/qualification-build --target luminumbra_server_app --parallel 4
      - name: Capture candidate simulation evidence
        id: capture
        timeout-minutes: 20
        run: |
          mkdir -p build/qualification
          python3 tools/perf/capture_sim_budget.py \
            --binary build/qualification-build/bin/luminumbra_server_app \
            --evidence-dir build/qualification/sim-budget-capture \
            --ticks 600 --seed 1337 --radius 1 --collision-radius 1
      - name: Propose candidate simulation budgets
        id: proposal
        run: python3 tools/perf/propose_sim_budgets.py build/qualification/sim-budget-capture --output build/qualification/sim-budget-proposal.json
      - name: Record existing budget check separately
        id: check
        run: |
          cp tools/perf/baselines/sim-budgets.json build/qualification/sim-budget-baseline.json
          python3 tools/perf/check_sim_budgets.py build/qualification/sim-budget-capture \
            build/qualification/sim-budget-baseline.json --output build/qualification/sim-budget-check.json
      - name: Bind candidate qualification evidence
        if: always()
        env:
          QUALIFICATION_PRODUCERS: '{"identity":"${{ steps.identity.outcome }}","configure":"${{ steps.configure.outcome }}","build":"${{ steps.build.outcome }}","capture":"${{ steps.capture.outcome }}","proposal":"${{ steps.proposal.outcome }}","check":"${{ steps.check.outcome }}"}'
        run: |
          python3 tools/ci/qualification_capture.py write --lane server-capture \
            --expected-sha "$QUALIFICATION_EXPECTED_SHA" \
            --binary build/qualification-build/bin/luminumbra_server_app \
            --capture build/qualification/sim-budget-capture \
            --proposal build/qualification/sim-budget-proposal.json \
            --check build/qualification/sim-budget-check.json \
            --baseline build/qualification/sim-budget-baseline.json \
            --output build/qualification/qualification-capture.json
      - name: Upload candidate qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-server-capture-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/qualification
          if-no-files-found: error
          retention-days: 30
      - name: Clean compiler cache before saving
        if: ${{ success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') && !(github.event_name == 'workflow_dispatch' && inputs.qualification_capture) && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: ccache --cleanup
      - name: Save candidate compiler cache
        if: ${{ success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') && !(github.event_name == 'workflow_dispatch' && inputs.qualification_capture) && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: qualification-server-linux-x64-gcc-${{ github.sha }}
