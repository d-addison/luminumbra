name: Game asset acquisition

on:
  push:
    branches: [main, devel]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, devel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Devel pushes share one workflow/ref group: the running run finishes, while
  # GitHub's queue of one replaces a pending run with the newest devel push.
  # The push suffix separates this group from cancellable scheduled runs.
  # The campaign freeze audit accepts a superseded devel run when a descendant
  # devel SHA's run of this same workflow is green or pending.
  # Main pushes and manual runs (including qualification captures) have isolated
  # groups and never cancel. PR ref grouping/cancellation stays unchanged.
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-manual-{1}', github.workflow, github.run_id) || github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}-{1}-{2}-{3}', github.workflow, github.ref, github.sha, github.run_id) || github.event_name == 'push' && github.ref == 'refs/heads/devel' && format('{0}-{1}-push', github.workflow, github.ref) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' && github.event_name != 'workflow_dispatch' }}

jobs:
  acquire:
    name: Verified game assets / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify refusal, bounded extraction and interrupted installation
        run: python tools/assets/test_acquire.py -v
      - name: Acquire pinned runtime pack
        run: python tools/assets/acquire.py --root "${{ runner.temp }}/game-assets-clean" --cache "${{ runner.temp }}/game-assets-cache"
      - name: Reuse verified runtime archive offline
        run: python tools/assets/acquire.py --offline --root "${{ runner.temp }}/game-assets-offline" --cache "${{ runner.temp }}/game-assets-cache"
      - name: Acquire pinned source pack
        run: python tools/assets/acquire.py --pack tree-small-02-source --root "${{ runner.temp }}/game-source-clean" --cache "${{ runner.temp }}/game-assets-cache"
